name: EXTREQ-07 IEEE 7009 bounded fidelity repair

on:
  push:
    branches:
      - agent/extreq-05-ieee-7014-1-fidelity-review
    paths:
      - vigil/scripts/extreq07_ieee_7009_fidelity.py
      - .github/workflows/extreq07-ieee-7009-inspect.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/extreq-05-ieee-7014-1-fidelity-review
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply bounded IEEE 7009 fidelity repair
        env:
          PYTHONPATH: vigil/scripts
        run: python vigil/scripts/extreq07_ieee_7009_fidelity.py --write

      - name: Advance durable metadata and fidelity expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('vigil/tests/test_external_requirement_metadata.py')
          s = p.read_text()
          s = s.replace('assert len(ids) == 722', 'assert len(ids) == 789')
          s = s.replace(
              'assert len(backlog_ids) == len(set(backlog_ids)) == 0',
              'assert len(backlog_ids) == len(set(backlog_ids)) == 4\n    assert sum(entry["external_source_id"] == "IEEE-7009" for entry in backlog["entries"]) == 4'
          )
          p.write_text(s)

          p = Path('vigil/tests/test_external_requirement_fidelity.py')
          s = p.read_text()
          needle = '        self.assertEqual(status[("IEEE-7014.1", "2026")], "assured")\n'
          if needle not in s:
              raise SystemExit('IEEE 7009 fidelity regression insertion point missing')
          if 'status[("IEEE-7009", "2024")]' not in s:
              s = s.replace(needle, '        self.assertEqual(status[("IEEE-7009", "2024")], "requires-reextraction")\n' + needle)
          p.write_text(s)
          PY

      - name: Add dedicated IEEE 7009 identity-preservation regression
        run: |
          cat > vigil/tests/test_ieee_7009_fidelity.py <<'PY'
          #!/usr/bin/env python3
          """Regression checks for the bounded IEEE 7009-2024 fidelity repair."""
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          REQ = ROOT / "external_governance" / "requirements"
          DIGEST = "9fb640fd57202fcc1c90aec0b6b767bf5c4621bfdefa7911c5e102425a83b133"
          COARSE = {
              "EXTREQ-528978BC3EB32446": {"EXTREQ-8204FA30873DD481", "EXTREQ-5306FB227197570A", "EXTREQ-95307E8CDBC1B4BE"},
              "EXTREQ-BBE358DBC3A6FD24": {"EXTREQ-09AC3C68DD3B9DA0", "EXTREQ-3197D476F0F03090"},
              "EXTREQ-C2FC30A1E260F4C1": {"EXTREQ-3CCDC8232F3887B6", "EXTREQ-1D3ECE3F78BA0638", "EXTREQ-81F4A4D7227B1970"},
              "EXTREQ-4041B6E279EF30CC": {"EXTREQ-4A98B446C4E83ECE", "EXTREQ-D400D6712209533C", "EXTREQ-2E3CBE869A1E2400"},
          }
          UNRESOLVED = {"timing_or_frequency", "required_artefacts", "evidence_expectation", "verification_method", "exceptions_or_qualifications"}

          records = json.loads((REQ / "requirements" / "IEEE-7009" / "2024.json").read_text(encoding="utf-8"))
          by_id = {record["requirement_id"]: record for record in records}
          ledger = json.loads((REQ / "metadata-review.json").read_text(encoding="utf-8"))
          review_by_id = {entry["requirement_id"]: entry for entry in ledger["entries"]}
          backlog = json.loads((REQ / "reextraction-backlog.json").read_text(encoding="utf-8"))
          fidelity = json.loads((REQ / "source-fidelity.json").read_text(encoding="utf-8"))

          assert len(records) == 67
          assert all(record["source_review_date"] == "2026-09-03" for record in records)
          assert all(record["interpretation_provenance"]["reviewed_source_digest"] == DIGEST for record in records)
          for legacy_id, successors in COARSE.items():
              assert legacy_id in by_id
              assert set(by_id[legacy_id]["related_external_requirements"]) == successors
          assert by_id["EXTREQ-BA54F8982F880F93"]["clause_or_control"] == "9.3"
          assert by_id["EXTREQ-BA54F8982F880F93"]["requirement_posture"] == "definitional"
          for record in records:
              statuses = review_by_id[record["requirement_id"]]["field_status"]
              if record["requirement_id"] in COARSE:
                  assert {field for field, status in statuses.items() if status == "review-required"} == UNRESOLVED
              else:
                  assert all(status != "review-required" for status in statuses.values())
          ieee_backlog = [entry for entry in backlog["entries"] if entry["external_source_id"] == "IEEE-7009"]
          assert {entry["current_requirement_id"] for entry in ieee_backlog} == set(COARSE)
          source_fidelity = next(entry for entry in fidelity["entries"] if entry["external_source_id"] == "IEEE-7009" and entry["source_version"] == "2024")
          assert source_fidelity["fidelity_status"] == "requires-reextraction"
          assert source_fidelity["effective_extraction_status"] == "partial"
          print("IEEE 7009 bounded fidelity regression passed")
          PY

      - name: Rebuild metadata review report
        env:
          PYTHONPATH: vigil/scripts
        run: python vigil/scripts/validate-external-requirement-metadata.py --write-report

      - name: Validate source fidelity
        env:
          PYTHONPATH: vigil/scripts
        run: python vigil/scripts/validate-external-requirement-fidelity.py

      - name: Rebuild external requirement projections
        run: python vigil/scripts/manage-external-requirements.py build

      - name: Validate generated projections
        run: python vigil/scripts/manage-external-requirements.py validate --check-generated

      - name: Run metadata regression
        env:
          PYTHONPATH: vigil/scripts
        run: python vigil/tests/test_external_requirement_metadata.py

      - name: Run IEEE 7009 regression
        run: python vigil/tests/test_ieee_7009_fidelity.py

      - name: Run fidelity regression
        env:
          PYTHONPATH: vigil/scripts
        run: python vigil/tests/test_external_requirement_fidelity.py

      - name: Run external governance tests
        run: python -m unittest vigil/tests/test_external_requirements.py vigil/tests/test_external_sources.py

      - name: Commit repaired corpus and durable regressions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/external_governance/requirements vigil/tests/test_external_requirement_metadata.py vigil/tests/test_external_requirement_fidelity.py vigil/tests/test_ieee_7009_fidelity.py
          if git diff --cached --quiet; then
            echo "No IEEE 7009 corpus changes to commit."
          else
            git commit -m "EXTREQ-07: commit IEEE 7009 bounded fidelity repair"
            git push origin HEAD:agent/extreq-05-ieee-7014-1-fidelity-review
          fi
