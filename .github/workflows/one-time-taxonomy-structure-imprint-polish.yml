name: One-time taxonomy structure and imprint polish

on:
  push:
    branches:
      - agent/hugging-face-authority-reconciliation
    paths:
      - ".github/workflows/one-time-taxonomy-structure-imprint-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Apply structure and imprint polish
        run: |
          python vigil/scripts/one-time-taxonomy-structure-imprint-polish.py
          python -m py_compile vigil/taxonomy/render_taxonomy.py

      - name: Generate publication
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify publication contract
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('vigil/taxonomy/render_taxonomy.py').read_text(encoding='utf-8')
          required = [
              '<h2>Outline</h2>',
              'class="chapter-overview"',
              '<section class="publisher-block">',
              '<h2>Publisher</h2>',
              '<strong>CAM Initiative</strong><br>Business entity: Phoenix Covenant Pty Ltd<br>ABN 14 692 195 529',
              'contents = ["<section class=\\"contents\\"><h1>Contents</h1><ol>"]',
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f'missing publication token: {token}')
          forbidden = [
              'Scope &amp; chapter map',
              '<dt>Rights holder</dt>',
              '<dt>Governance editor</dt>',
              '<dt>Publisher</dt><dd>CAM Initiative</dd>',
              'Copyright © 2026 Dr Michelle O\'Rourke.',
              '<section class=\\"contents\\"><h1>Governance Failure Taxonomy</h1><p>Technical Reference</p>',
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit(f'obsolete publication token remains: {token}')

          pdf = Path('vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf')
          if not pdf.exists() or pdf.stat().st_size < 5000 or not pdf.read_bytes().startswith(b'%PDF-'):
              raise SystemExit('taxonomy PDF was not generated correctly')
          print(f'PDF: {pdf.stat().st_size:,} bytes')
          PY

      - name: Upload PDF for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-structure-imprint-pdf
          path: vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if-no-files-found: error

      - name: Commit renderer and generated publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/taxonomy/render_taxonomy.py
          git add vigil/taxonomy/generated/*.html
          git add vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if git diff --cached --quiet; then
            echo "Publication already current."
          else
            git commit -m "Refine taxonomy chapter structure and publisher imprint"
            git push
          fi
