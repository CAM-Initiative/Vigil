name: One-time final taxonomy textbook pass

on:
  push:
    branches:
      - agent/hugging-face-authority-reconciliation
    paths:
      - ".github/workflows/one-time-taxonomy-final-textbook-pass.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-textbook-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint pymupdf

      - name: Apply final textbook pass
        run: |
          python vigil/scripts/one-time-taxonomy-final-textbook-pass.py
          python -m py_compile vigil/taxonomy/render_taxonomy.py

      - name: Generate publication
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify textbook contract and Case Study coverage
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import pymupdf

          module_path = Path('vigil/taxonomy/render_taxonomy.py')
          spec = importlib.util.spec_from_file_location('taxonomy_renderer', module_path)
          renderer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(renderer)

          source = module_path.read_text(encoding='utf-8')
          required = [
              'def select_class_case_examples',
              'up to three publication-grade exemplars for every failure class',
              'Phoenix Covenant Pty Ltd · ABN 14 692 195 529',
              "Reviewer: Dr M.V. O'Rourke",
              'Generative AI disclosure.',
              'specific model used is captured in the applicable metadata records',
              'target-counter(attr(href), page)',
              'case-study-source',
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f'missing final textbook token: {token}')
          forbidden = [
              '<h2>Outline</h2>',
              '<h3>Scope</h3>',
              'Business entity: Phoenix Covenant Pty Ltd',
              'select_family_case_examples',
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit(f'obsolete publication token remains: {token}')

          families = renderer.load_catalogue()
          examples = renderer.load_case_examples()
          total_classes = 0
          covered_classes = 0
          total_cases = 0
          distribution = {0: 0, 1: 0, 2: 0, 3: 0}
          print('Case Study coverage by class:')
          for family in families:
              selected = renderer.select_class_case_examples(family, examples)
              for item in family.get('classes', []):
                  class_id = str(item.get('class_id', ''))
                  count = len(selected.get(class_id, []))
                  total_classes += 1
                  total_cases += count
                  distribution[count] = distribution.get(count, 0) + 1
                  if count:
                      covered_classes += 1
                  print(f"  {class_id}: {count}")
          print(f'Total classes: {total_classes}')
          print(f'Classes with >=1 Case Study: {covered_classes}')
          print(f'Total selected Case Studies: {total_cases}')
          print(f'Distribution: {distribution}')
          if max(distribution) > 3:
              raise SystemExit('a class exceeded the three-Case-Study publication cap')

          pdf = Path('vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf')
          if not pdf.exists() or pdf.stat().st_size < 5000 or not pdf.read_bytes().startswith(b'%PDF-'):
              raise SystemExit('taxonomy PDF was not generated correctly')
          doc = pymupdf.open(pdf)
          if len(doc) < 20:
              raise SystemExit('taxonomy PDF unexpectedly short')
          # WeasyPrint may encode same-document targets as GOTO or NAMED links.
          internal = 0
          external = 0
          link_kinds = {}
          for page in doc:
              for link in page.get_links():
                  kind = link.get('kind')
                  link_kinds[kind] = link_kinds.get(kind, 0) + 1
                  if kind in (pymupdf.LINK_GOTO, pymupdf.LINK_NAMED):
                      internal += 1
                  elif kind == pymupdf.LINK_URI and link.get('uri'):
                      external += 1
          print(f'PDF pages: {len(doc)}')
          print(f'Link kinds: {link_kinds}')
          print(f'Internal links: {internal}')
          print(f'External links: {external}')
          if internal < 9:
              raise SystemExit('expected at least nine internal chapter links in the PDF')
          if external < 1:
              raise SystemExit('expected at least one external Case Study source URL in the PDF')
          PY

      - name: Upload PDF for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-final-textbook-pdf
          path: vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if-no-files-found: error

      - name: Commit renderer and generated publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/taxonomy/render_taxonomy.py
          git add vigil/taxonomy/generated/*.html
          git add vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if git diff --cached --quiet; then
            echo "Final textbook publication already current."
          else
            git commit -m "Finalize taxonomy textbook structure and case studies"
            if ! git push; then
              echo "Branch advanced while the textbook was building; leaving generated artefact available for review without reconciling branch history."
              exit 0
            fi
          fi
