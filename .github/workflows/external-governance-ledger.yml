name: External governance source ledger

on:
  push:
    paths:
      - "vigil/external_sources/**"
      - "vigil/scripts/manage-external-governance-ledger.py"
      - "vigil/tests/test_external_governance_ledger.py"
      - ".github/workflows/external-governance-ledger.yml"
  pull_request:
    paths:
      - "vigil/external_sources/**"
      - "vigil/scripts/manage-external-governance-ledger.py"
      - "vigil/tests/test_external_governance_ledger.py"
      - ".github/workflows/external-governance-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Test deterministic lifecycle and review-state transitions
        run: python vigil/tests/test_external_governance_ledger.py
      - name: Validate source matrix, ledger and alignment queue
        run: python vigil/scripts/manage-external-governance-ledger.py validate

# Deliberately no scheduled network ingestion yet. Live source adapters are enabled only
# after each upstream endpoint/query contract has been tested independently. A future
# scheduled fetch may update VIGIL maintenance state, but MUST NOT edit Caelestis or
# create substantive VIGIL records automatically.
