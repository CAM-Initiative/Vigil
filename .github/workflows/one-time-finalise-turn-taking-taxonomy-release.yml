name: One-time finalise turn-taking taxonomy release

on:
  push:
    branches:
      - agent/synthetic-turn-taking-classification
    paths:
      - ".github/workflows/one-time-finalise-turn-taking-taxonomy-release.yml"
      - "vigil/scripts/one-time-finalise-turn-taking-taxonomy-release.py"

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Finalise taxonomy release metadata
        run: python vigil/scripts/one-time-finalise-turn-taking-taxonomy-release.py

      - name: Validate taxonomy
        run: python vigil/taxonomy/validate_taxonomy.py

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/taxonomy/VIGIL.FailureTaxonomy.Index.json vigil/taxonomy/families
          if git diff --cached --quiet; then
            echo "No taxonomy release metadata changes to commit."
          else
            git commit -m "Release taxonomy 0.2.3-draft with synthetic turn-state class"
            git push
          fi
