name: EXTREQ-09 IEEE 7001 execute

on:
  push:
    branches:
      - agent/extreq-05-ieee-7014-1-fidelity-review
    paths:
      - .github/workflows/extreq09-ieee-7001-execute.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/extreq-05-ieee-7014-1-fidelity-review
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply IEEE 7001 fidelity enrichment
        run: python vigil/scripts/extreq09_ieee_7001_fidelity.py

      - name: Update fidelity regression contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path("vigil/tests/test_external_requirement_fidelity.py")
          text = p.read_text()
          text, n = re.subn(
              r'self\.assertEqual\(summary\["fidelity_assured_effective_complete_sources"\], \d+\)',
              'self.assertEqual(summary["fidelity_assured_effective_complete_sources"], 14)',
              text,
              count=1,
          )
          assert n == 1
          needle = '        self.assertEqual(status[("IEEE-7014", "2024")], "assured")\n'
          addition = needle + '        self.assertEqual(status[("IEEE-7001", "2021")], "assured")\n'
          assert needle in text
          if 'status[("IEEE-7001", "2021")]' not in text:
              text = text.replace(needle, addition)
          p.write_text(text)
          PY

      - name: Add IEEE 7001 regression test
        run: |
          cat > vigil/tests/test_ieee_7001_fidelity.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          REQ = ROOT / "external_governance" / "requirements"
          SHARD = REQ / "requirements" / "IEEE-7001" / "2021.json"
          DIGEST = "2bf1a21360236fffa7d87a71d544cd47153dae2bbcdf7e48dffe19bda289006b"

          records = json.loads(SHARD.read_text())
          assert len(records) == 33
          ids = {r["requirement_id"] for r in records}
          assert len(ids) == 33
          assert all(r["source_review_date"] == "2026-09-04" for r in records)
          assert all(r["interpretation_provenance"]["reviewed_source_digest"] == DIGEST for r in records)

          ledger = json.loads((REQ / "metadata-review.json").read_text())
          by_id = {e["requirement_id"]: e for e in ledger["entries"]}
          fields = (
              "applicable_actor","governed_object","timing_or_frequency","required_artefacts",
              "evidence_expectation","verification_method","applicability_conditions",
              "exceptions_or_qualifications",
          )
          for r in records:
              assert r["requirement_id"] in by_id
              assert all(by_id[r["requirement_id"]]["field_status"][f] != "review-required" for f in fields)

          fidelity = json.loads((REQ / "source-fidelity.json").read_text())
          f = next(e for e in fidelity["entries"] if e["external_source_id"] == "IEEE-7001" and e["source_version"] == "2021")
          assert f["fidelity_status"] == "assured"
          assert f["effective_extraction_status"] == "complete"
          assert set(f["audited_requirement_ids"]) == ids

          assurance = json.loads((REQ / "source-review-assurance.json").read_text())
          a = next(e for e in assurance["source_reviews"] if e["external_source_id"] == "IEEE-7001" and e["source_version"] == "2021")
          assert a["reviewed_source_digest"]["digest"] == DIGEST
          assert a["reviewed_source_digest"]["access_basis"] == "licensed-primary"

          assert sum(r["clause_or_control"].startswith("Table 1") for r in records) == 9
          assert sum(r["clause_or_control"].startswith("Table 2") for r in records) == 5
          assert sum(r["clause_or_control"].startswith("Table 3") for r in records) == 7
          assert sum(r["clause_or_control"].startswith("Table 4") for r in records) == 6
          assert sum(r["clause_or_control"].startswith("Table 5") for r in records) == 4
          assert sum(r["clause_or_control"] == "5.2.2 principle" for r in records) == 1
          assert sum(r["clause_or_control"] == "5.1.1 general" for r in records) == 1
          print("IEEE 7001 fidelity regression contract valid")
          PY
          python vigil/tests/test_ieee_7001_fidelity.py

      - name: Write EXTREQ-09 audit note
        run: |
          cat > vigil/docs/audits/external-requirements/EXTREQ-09-IEEE-7001-FIDELITY-REVIEW.md <<'MD'
          # EXTREQ-09 — IEEE 7001-2021 fidelity review

          **Source:** IEEE Std 7001-2021
          **VIGIL source:** EXT-338E4D8BD259
          **Review basis:** lawfully accessed licensed primary text
          **Review date:** 2026-09-04
          **Reviewed source SHA-256:** 2bf1a21360236fffa7d87a71d544cd47153dae2bbcdf7e48dffe19bda289006b

          ## Disposition

          Direct review of Clause 5 and Tables 1–5 confirmed that the existing 33 analytical records provide bounded coverage of the operative stakeholder transparency requirements. All 33 established EXTREQ identities are retained. No source-supported requirement identity was added or removed.

          The review confirmed the source's stakeholder-specific transparency-level rules: user and expert-advisor scales are non-progressive; validation/certification and incident-investigator scales are progressive; public/bystander levels are non-progressive except that Level 3 requires Level 2. Repeated highest levels that add no new requirement are not duplicated as separate analytical records.

          ## Metadata and provenance

          The 33 records are field-level reviewed against the licensed primary text. Source-explicit artefacts, evidence, timing, verification cues, applicability and qualifications are populated; source silence is recorded without inference. Existing source-supported actor and governed-object values are preserved.

          Requirement summaries and metadata remain analytical paraphrases. Licensed IEEE text is not stored in VIGIL. The exact reviewed-source digest is recorded in the source-review assurance sidecar. No human review or verification is claimed.

          ## Stability

          Retain all 33 reviewed identities and repeat fidelity review only on material source revision or a demonstrated record-specific defect.
          MD

      - name: Regenerate and validate
        run: |
          set -e
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-metadata.py --write-report
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-fidelity.py
          python vigil/scripts/manage-external-requirements.py build
          python vigil/scripts/manage-external-requirements.py validate --check-generated
          python vigil/tests/test_ieee_7001_fidelity.py
          python vigil/tests/test_external_requirement_metadata.py
          python vigil/tests/test_external_requirement_fidelity.py
          python -m unittest vigil/tests/test_external_requirements.py vigil/tests/test_external_sources.py

      - name: Check expected review-state movement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("vigil/external_governance/requirements/metadata-review-report.json")
          d = json.loads(p.read_text())
          s = d["summary"] if "summary" in d else d
          print(s)
          PY

      - name: Remove one-off EXTREQ-09 machinery
        run: |
          rm -f vigil/scripts/extreq09_ieee_7001_fidelity.py
          rm -f .github/workflows/extreq09-ieee-7001-execute.yml

      - name: Commit validated IEEE 7001 tranche
        run: |
          set -e
          git config user.name "CAM-Initiative"
          git config user.email "aeon.tier@protonmail.com"
          git add -A
          git diff --cached --check
          git commit -m "EXTREQ-09: assure IEEE 7001 fidelity"
          git push origin HEAD:agent/extreq-05-ieee-7014-1-fidelity-review
