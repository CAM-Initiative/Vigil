name: VIGIL Observatory taxonomy publications
# Publication styling consumes Registry-pinned CAM brand assets via render_taxonomy.py.

on:
  push:
    branches:
      - main
    paths:
      - "vigil/taxonomy/VIGIL.FailureTaxonomy.Index.json"
      - "vigil/taxonomy/families/**"
      - "vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json"
      - "vigil/taxonomy/render_taxonomy.py"
      - ".github/workflows/taxonomy-publications.yml"
  pull_request:
    paths:
      - "vigil/taxonomy/VIGIL.FailureTaxonomy.Index.json"
      - "vigil/taxonomy/families/**"
      - "vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json"
      - "vigil/taxonomy/render_taxonomy.py"
      - ".github/workflows/taxonomy-publications.yml"
  workflow_dispatch:

concurrency:
  group: vigil-taxonomy-publications-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  housekeeping-format-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'housekeeping/scripts-tests-audits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: housekeeping/scripts-tests-audits
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Restore pre-reconciliation compact formatting
        shell: bash
        run: |
          git show 4ca9d9016dd102d347daf5f3a297882181d3b1c2:vigil/taxonomy/families/VIGIL-FF-0001-authority-boundary-integrity.json \
            > vigil/taxonomy/families/VIGIL-FF-0001-authority-boundary-integrity.json
          git show 4ca9d9016dd102d347daf5f3a297882181d3b1c2:vigil/records/observations/2026/VIGIL-2026-OBS-0033.json \
            > vigil/records/observations/2026/VIGIL-2026-OBS-0033.json
          python - <<'PY'
          from pathlib import Path

          path = Path("vigil/records/observations/2026/VIGIL-2026-OBS-0033.json")
          text = path.read_text(encoding="utf-8")
          old = '"product_or_service": "ChatGPT; Perplexity Answer Engine; public web retrieval ecosystem"'
          new = '"product_or_service": "Other"'
          if old not in text:
              raise SystemExit("OBS-0033 aggregate product field was not found in the preserved source formatting")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python vigil/taxonomy/validate_taxonomy.py
          python vigil/tests/test_validate_vigil_records.py -b

      - name: Commit format-only cleanup
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(vigil/taxonomy/families/VIGIL-FF-0001-authority-boundary-integrity\.json|vigil/records/observations/2026/VIGIL-2026-OBS-0033\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Formatting cleanup changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            vigil/taxonomy/families/VIGIL-FF-0001-authority-boundary-integrity.json \
            vigil/records/observations/2026/VIGIL-2026-OBS-0033.json
          if git diff --cached --quiet; then
            echo "No formatting cleanup remains."
          else
            git commit -m "Preserve taxonomy and observation source formatting"
            git push origin "HEAD:housekeeping/scripts-tests-audits"
          fi

  build-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate taxonomy contract and release ledger
        shell: bash
        run: |
          set +e
          python vigil/taxonomy/validate_taxonomy.py
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path("vigil/taxonomy/validate_taxonomy.py")
          spec = importlib.util.spec_from_file_location("validate_taxonomy", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          loaded = []
          family_ids = set()
          class_ids = set()
          for family_path in sorted(Path("vigil/taxonomy/families").glob("*.json")):
              data = json.loads(family_path.read_text(encoding="utf-8"))
              loaded.append((family_path, data))
              family = data.get("family", {})
              family_id = family.get("family_id")
              if family_id:
                  family_ids.add(family_id)
              for item in data.get("classes", []):
                  class_id = item.get("class_id") if isinstance(item, dict) else None
                  if class_id:
                      class_ids.add(class_id)

          print("Current canonical taxonomy release state:")
          print(f"  content_digest: {module.catalogue_content_digest(loaded)}")
          print(f"  family_ids: {sorted(family_ids)}")
          print(f"  class_count: {len(class_ids)}")
          PY
            exit "$status"
          fi

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Generate HTML and PDF references
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify publication artefacts
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("vigil/taxonomy/generated/VIGIL.FailureTaxonomy.FullReference.html")
          pdf = Path("vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf")
          if not html.exists() or html.stat().st_size < 1000:
              raise SystemExit("Full-reference HTML was not generated correctly")
          if not pdf.exists() or pdf.stat().st_size < 5000:
              raise SystemExit("Full-reference PDF was not generated correctly")
          if not pdf.read_bytes().startswith(b"%PDF-"):
              raise SystemExit("Generated taxonomy publication is not a valid PDF stream")
          print(f"HTML: {html.stat().st_size:,} bytes")
          print(f"PDF:  {pdf.stat().st_size:,} bytes")
          PY

      - name: Verify generated publications are current
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- vigil/taxonomy/generated; then
            echo "Committed taxonomy publication outputs are stale."
            git diff --stat -- vigil/taxonomy/generated
            exit 1
          fi

      - name: Commit generated publication outputs
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/taxonomy/generated/*.html
          git add vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if git diff --cached --quiet; then
            echo "No taxonomy publication changes to commit."
          else
            git commit -m "Rebuild VIGIL Observatory taxonomy publications"
            if ! git push; then
              echo "Branch advanced while taxonomy publications were building; a newer run owns generated-output refresh."
              exit 0
            fi
          fi
