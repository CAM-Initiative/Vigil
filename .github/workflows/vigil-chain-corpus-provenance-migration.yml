name: Apply VIGIL chain and corpus provenance migration

on:
  push:
    branches:
      - governance/learn-record-exemplar
    paths:
      - "vigil/scripts/migrate-vigil-chain-and-corpus-provenance.py"
      - ".github/workflows/vigil-chain-corpus-provenance-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: governance/learn-record-exemplar
          fetch-depth: 0

      - name: Apply migration
        run: python vigil/scripts/migrate-vigil-chain-and-corpus-provenance.py

      - name: Validate migrated JSON
        run: |
          python -m json.tool vigil/records/observations/2026/VIGIL-2026-OBS-0021.json >/dev/null
          python -m json.tool vigil/templates/patch-note-record-template.json >/dev/null
          python -m json.tool vigil/VIGIL.Schema.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          patches = sorted(Path('vigil/records/patches/2026').glob('VIGIL-*-PATCH-*.json'))
          assert patches
          for path in patches:
              data = json.loads(path.read_text())
              provenance = data.get('corpus_release_provenance')
              assert provenance, path
              assert provenance['repository'] == 'CAM-Initiative/Caelestis', path
              assert provenance['published_release_at_implementation']['status'] in {'verified', 'not-established-from-current-record', 'not-applicable'}, path
          obs = json.loads(Path('vigil/records/observations/2026/VIGIL-2026-OBS-0021.json').read_text())
          linked = obs['linked_records']
          assert linked['related_failure_modes'] == ['VIGIL-2026-FM-0017']
          assert linked['related_patch_notes'] == ['VIGIL-2026-PATCH-0019']
          assert all(item['chain_inclusion'] is False for item in linked['contextual_relations'])
          print(f'Validated {len(patches)} PATCH provenance records and OBS-0021 routing.')
          PY

      - name: Commit migration output
        run: |
          if git diff --quiet; then
            echo "Migration output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/records vigil/templates/patch-note-record-template.json vigil/VIGIL.Schema.json vigil/migrations
          git commit -m "Repair OBS-0021 chain and record PATCH corpus provenance"
          git push origin HEAD:governance/learn-record-exemplar
