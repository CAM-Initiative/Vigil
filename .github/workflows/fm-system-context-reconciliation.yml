name: FM system-context reconciliation

on:
  push:
    branches:
      - agent/instrumental-coercive-influence-capability-revalidation
    paths:
      - "vigil/scripts/reconcile-fm-system-context.py"
      - "vigil/tests/test_reconcile_fm_system_context.py"
      - ".github/workflows/fm-system-context-reconciliation.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Test FM system-context reconciliation
        run: python vigil/tests/test_reconcile_fm_system_context.py

      - name: Reconcile all failure-mode system contexts
        run: |
          python vigil/scripts/reconcile-fm-system-context.py --write-report
          python vigil/scripts/reconcile-fm-system-context.py --check

      - name: Commit reconciled failure-mode records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/records/failures vigil/docs/reviews/FM-SYSTEM-CONTEXT-01-evidence-rollup-reconciliation.md
          if git diff --cached --quiet; then
            echo "FM system-context reconciliation already current."
          else
            git commit -m "Reconcile FM system context from evidence"
            git push
          fi
