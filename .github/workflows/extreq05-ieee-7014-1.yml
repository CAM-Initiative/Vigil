name: EXTREQ-05 IEEE 7014.1 fidelity tranche

on:
  push:
    branches:
      - agent/extreq-05-ieee-7014-1-fidelity-review
    paths:
      - vigil/scripts/extreq05_ieee_7014_1_fidelity.py

permissions:
  contents: write

jobs:
  enrich-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extreq-05-ieee-7014-1-fidelity-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded IEEE 7014.1 metadata fidelity review
        run: python vigil/scripts/extreq05_ieee_7014_1_fidelity.py --write
      - name: Rebuild metadata report
        run: python vigil/scripts/validate-external-requirement-metadata.py --write-report
      - name: Validate semantic fidelity
        run: python vigil/scripts/validate-external-requirement-fidelity.py
      - name: Rebuild external requirement projections
        run: python vigil/scripts/manage-external-requirements.py build
      - name: Validate generated external requirement projections
        run: python vigil/scripts/manage-external-requirements.py validate --check-generated
      - name: Test metadata review contracts
        env:
          PYTHONPATH: vigil/scripts
        run: python vigil/tests/test_external_requirement_metadata.py
      - name: Test fidelity contracts
        env:
          PYTHONPATH: vigil/scripts
        run: python vigil/tests/test_external_requirement_fidelity.py
      - name: Test external governance corpus
        run: python -m unittest vigil/tests/test_external_requirements.py vigil/tests/test_external_sources.py
      - name: Commit enriched corpus and generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/external_governance/requirements
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "EXTREQ-05: enrich IEEE 7014.1 metadata fidelity"
            git push origin HEAD:agent/extreq-05-ieee-7014-1-fidelity-review
          fi
