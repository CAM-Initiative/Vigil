name: One-time patch turn-taking Incident builder

on:
  push:
    branches:
      - agent/synthetic-turn-taking-classification
    paths:
      - ".github/workflows/one-time-patch-turn-taking-incident-builder.yml"
      - "vigil/scripts/one-time-patch-turn-taking-incident-builder.py"
      - "vigil/scripts/one-time-fix-turn-taking-builder-basis.py"

permissions:
  contents: write

jobs:
  patch-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Patch authoritative Incident migration builder
        run: |
          python vigil/scripts/one-time-patch-turn-taking-incident-builder.py
          python vigil/scripts/one-time-fix-turn-taking-builder-basis.py

      - name: Rebuild Incident registry
        run: python vigil/scripts/build-incident-registry.py

      - name: Validate Incident migration
        run: |
          python vigil/tests/test_incident_registry.py
          python vigil/scripts/build-incident-migration-decisions.py
          python vigil/scripts/build-incident-migration-crosswalk.py
          python vigil/scripts/validate-incident-migration.py

      - name: Commit deterministic correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/scripts/build-incident-registry.py vigil/records/incidents/VIGIL-INC-000078.json
          if git diff --cached --quiet; then
            echo "No Incident builder changes to commit."
          else
            git commit -m "Make turn-taking Incident classification deterministic"
            git push
          fi
