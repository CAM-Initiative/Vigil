name: One-time consolidate VIGIL PRs

on:
  push:
    branches:
      - governance/proposal-source-and-patch-traceability
    paths:
      - .github/workflows/one-time-consolidate-vigil-prs.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out VIGIL consolidation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check out canonical Caelestis main
        uses: actions/checkout@v6
        with:
          repository: CAM-Initiative/Caelestis
          path: caelestis
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Consolidate source records and canonicalise PATCH-0031
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin governance/red-team-governance-patch:refs/remotes/origin/governance/red-team-governance-patch
          git checkout origin/governance/red-team-governance-patch -- \
            vigil/records/failures/2026/VIGIL-2026-FM-0047.json \
            vigil/records/patches/2026/VIGIL-2026-PATCH-0031.json \
            vigil/records/research/2026/VIGIL-2026-RESEARCH-0002.md

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          CAELESTIS = ROOT / "caelestis"
          TODAY = "2026-07-28"
          OLD_SHA = "e64f73289774b91c6232162f01d2723dd79bac25"
          PATCH_ID = "VIGIL-2026-PATCH-0031"

          def git(*args: str) -> str:
              return subprocess.check_output(["git", "-C", str(CAELESTIS), *args], text=True).strip()

          try:
              canonical_sha = git("log", "--format=%H", "--grep=^Reconcile civilisational wealth and red-team governance divergence$", "-n", "1")
          except subprocess.CalledProcessError:
              canonical_sha = ""
          if not canonical_sha:
              canonical_sha = git("rev-parse", "HEAD")

          def load_json(path: Path) -> dict:
              return json.loads(path.read_text(encoding="utf-8"))

          def save_json(path: Path, payload: dict) -> None:
              path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          def canonicalise_string(value: str) -> str:
              replacements = (
                  (OLD_SHA, canonical_sha),
                  ("policy/civilisational-wealth-governance", "main"),
                  ("verified-branch-only", "verified-canonical-main"),
                  ("branch-only", "canonical-main"),
                  ("working-branch", "canonical-main"),
                  ("working branch", "canonical main"),
                  ("Canonical adoption remains pending.", "Canonical adoption is complete."),
                  ("canonical adoption remains pending", "canonical adoption is complete"),
                  ("not yet canonical on main", "canonical on main"),
              )
              for old, new in replacements:
                  value = value.replace(old, new)
              return value

          def canonicalise_tree(value):
              if isinstance(value, str):
                  return canonicalise_string(value)
              if isinstance(value, list):
                  return [canonicalise_tree(item) for item in value]
              if isinstance(value, dict):
                  return {key: canonicalise_tree(item) for key, item in value.items()}
              return value

          def extract_heading_block(text: str, heading: str) -> str:
              lines = text.splitlines(keepends=True)
              target = heading.strip()
              start = next((i for i, line in enumerate(lines) if line.strip() == target), None)
              if start is None:
                  raise RuntimeError(f"Unable to locate heading {heading!r}")
              match = re.match(r"^(#+)\s", target)
              if not match:
                  raise RuntimeError(f"Invalid Markdown heading {heading!r}")
              level = len(match.group(1))
              end = len(lines)
              for index in range(start + 1, len(lines)):
                  next_heading = re.match(r"^(#+)\s", lines[index])
                  if next_heading and len(next_heading.group(1)) <= level:
                      end = index
                      break
              return "".join(lines[start:end]).rstrip() + "\n"

          def extract_substantive_instrument(text: str) -> str:
              provenance = re.search(r"(?m)^##+\s+(?:\d+(?:\.\d+)*\s+)?(?:Provenance|Authorship)(?:\s|&|$)", text)
              end = provenance.start() if provenance else len(text)
              return text[:end].rstrip() + "\n"

          patch_path = ROOT / "vigil/records/patches/2026/VIGIL-2026-PATCH-0031.json"
          patch = load_json(patch_path)
          patch["record_identity"]["updated"] = TODAY
          patch["record_identity"]["version"] = "1.1"
          patch["summary"] = (
              "Records the canonical Caelestis cross-domain red-team governance extension for "
              "VIGIL-2026-FM-0047 and VIGIL-2026-PROP-0019. The coordinated constitutional, ethical, "
              "security, stewardship, operational, runtime, Tendeka, incident, audit and artefact controls "
              f"are verified on Caelestis main at commit {canonical_sha}. External runtime conformance and "
              "incident-specific telemetry remain separately monitored."
          )
          decision_trace = patch.get("decision_trace", {})
          decision_trace["decision_summary"] = (
              "The evidence chain established that red-team governance required a constitutional prohibition "
              "plus domain-specific implementation. The complete repair has now been adopted on canonical "
              "Caelestis main, while external deployment evidence remains a separate monitoring question."
          )
          events = decision_trace.setdefault("events", [])
          if not any(event.get("event_type") == "canonical-adoption-verified" for event in events if isinstance(event, dict)):
              events.append({
                  "date": TODAY,
                  "event_type": "canonical-adoption-verified",
                  "description": "The reconciled red-team governance package was verified on canonical Caelestis main after branch-divergence repair.",
                  "authority_role": "CAM constitutional authority under human governance editorship",
                  "evidence_references": [
                      f"https://github.com/CAM-Initiative/Caelestis/commit/{canonical_sha}",
                      "https://github.com/CAM-Initiative/Caelestis/pull/102"
                  ]
              })
          patch["decision_trace"] = decision_trace

          implementation = patch["corpus_implementation"]
          implementation["canonical_state"] = "canonical-main"
          implementation["implementation_outcome"] = (
              "The coordinated cross-domain Caelestis extension is adopted on canonical main. Literal evidence "
              "below has been refreshed against the canonical reconciliation commit and verified as current on main."
          )

          for entry in implementation.get("entries", []):
              source = entry["source"]
              path = source["path"]
              current_text = (CAELESTIS / path).read_text(encoding="utf-8")
              resulting_text = entry.get("resulting_text", "")
              section = str(entry.get("section", ""))
              heading = str(entry.get("section_heading", ""))

              if "entire instrument" in section.lower():
                  resulting_text = extract_substantive_instrument(current_text)
              elif resulting_text not in current_text:
                  resulting_text = extract_heading_block(current_text, heading)

              entry["resulting_text"] = resulting_text
              source["commit"] = canonical_sha
              source["direct_url"] = f"https://github.com/CAM-Initiative/Caelestis/blob/{canonical_sha}/{path}"
              entry["verification"]["status"] = "verified-canonical-main"
              entry["verification"]["verified_on"] = TODAY
              entry["verification"]["review_id"] = "VIGIL-REVIEW-2026-07-28-GPT56-PATCH-0031-CANONICAL"
              entry["verification"]["exact_text_match"] = True
              entry["verification"]["current_clause_status"] = "current"

              if entry.get("prior_text_status") == "captured":
                  prior_text = entry.get("prior_text")
                  parent = git("rev-parse", f"{canonical_sha}^")
                  completed = subprocess.run(
                      ["git", "-C", str(CAELESTIS), "show", f"{parent}:{path}"],
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  if completed.returncode or not isinstance(prior_text, str) or prior_text not in completed.stdout:
                      entry["prior_text"] = None
                      entry["prior_text_status"] = "unavailable"

          for key in (
              "change_details",
              "implementation_verification",
              "impact_summary",
              "remaining_work",
              "source_records",
              "cam_internal",
              "repair_provenance",
          ):
              if key in patch:
                  patch[key] = canonicalise_tree(patch[key])

          remaining = patch.get("remaining_work")
          monitoring_note = "Continue external runtime-conformance, incident-telemetry and ecosystem monitoring; canonical corpus adoption is complete."
          if isinstance(remaining, list):
              remaining = [
                  item for item in remaining
                  if not (isinstance(item, str) and any(term in item.lower() for term in ("merge", "canonical adoption", "branch-only")))
              ]
              if monitoring_note not in remaining:
                  remaining.append(monitoring_note)
              patch["remaining_work"] = remaining
          elif isinstance(remaining, dict):
              patch["remaining_work"] = canonicalise_tree(remaining)

          save_json(patch_path, patch)

          fm_path = ROOT / "vigil/records/failures/2026/VIGIL-2026-FM-0047.json"
          fm = load_json(fm_path)
          fm["record_identity"]["updated"] = TODAY
          fm["record_identity"]["version"] = "1.5"
          fm["triage"].update({
              "triage_status": "CAM repair canonical on Caelestis main; ecosystem monitoring active",
              "mitigation_status": f"{PATCH_ID} records the canonical, corpus-verified cross-domain Caelestis repair at {canonical_sha}.",
              "escalation_required": "external runtime conformance and incident telemetry monitoring",
              "recommended_next_step": "Maintain canonical PATCH verification and continue monitoring external implementation, runtime conformance and unresolved incident telemetry."
          })
          fm["repair_status"].update({
              "status": "repaired",
              "repaired_by": [PATCH_ID],
              "date_repaired": TODAY,
              "verification_status": "corpus-verified",
              "monitoring_status": "active-monitoring",
              "repair_basis": "patch-implemented",
              "remaining_gaps": []
          })
          coverage = fm["corpus_coverage"]
          coverage.update({
              "classification": "implemented-repair",
              "corpus_ref": "main",
              "corpus_commit": canonical_sha,
              "assessed_date": TODAY,
              "coverage_summary": f"{PATCH_ID} records the canonical cross-domain Caelestis repair at {canonical_sha}. The CAM-side governance gap is repaired; external deployment and incident telemetry remain ecosystem-monitoring matters.",
              "remaining_gaps": []
          })
          for item in coverage.get("covered_by", []):
              if isinstance(item, dict) and item.get("coverage_type") == "implemented-branch-doctrine":
                  item["coverage_type"] = "implemented-canonical-doctrine"
          ecosystem = fm.get("ecosystem_status")
          if isinstance(ecosystem, dict):
              ecosystem["last_assessed"] = TODAY
              ecosystem["monitoring_required"] = True
              ecosystem["basis"] = (
                  "The CAM-side corpus repair is canonical and verified. External provider adoption, runtime conformance, "
                  "incident-specific GPT-Red participation and complete orchestration telemetry remain unresolved."
              )
          save_json(fm_path, fm)

          prop_path = ROOT / "vigil/records/proposals/2026/VIGIL-2026-PROP-0019.json"
          prop = load_json(prop_path)
          prop["record_state"] = "closed-actioned"
          prop["record_identity"]["updated"] = TODAY
          prop["record_identity"]["version"] = "1.4"
          patch_links = prop["linked_records"].setdefault("related_patch_notes", [])
          if PATCH_ID not in patch_links:
              patch_links.append(PATCH_ID)
          prop["cam_internal"]["drafting_status"] = "implemented and verified on canonical Caelestis main"
          prop["next_action"] = (
              "No further corpus drafting under this proposal. Maintain PATCH-0031 verification and continue "
              "external runtime-conformance, incident-telemetry and ecosystem monitoring."
          )
          prop["resolution_status"] = {
              "status": "resolved-by-patch",
              "resolved_by": [PATCH_ID],
              "resolution_note": f"Resolved by the canonical Caelestis implementation recorded in {PATCH_ID} at commit {canonical_sha}."
          }
          prop["coverage_reconciliation"] = {
              "status": "current-corpus-coverage-verified",
              "assessed_date": TODAY,
              "corpus_commit": canonical_sha,
              "resolved_by": [PATCH_ID],
              "remaining_scope": [
                  "External runtime-conformance evidence and incident-specific telemetry remain monitoring matters rather than unresolved corpus drafting."
              ],
              "note": "The cross-domain red-team governance package is canonical on Caelestis main."
          }
          save_json(prop_path, prop)

          print(f"Canonical Caelestis commit: {canonical_sha}")
          print("Consolidated PR #45 source records into PR #43 branch.")
          PY

      - name: Validate consolidated VIGIL source and patch trace
        run: |
          python vigil/scripts/test_validate_vigil_records.py
          python vigil/scripts/test_validate_vigil_lifecycle.py
          python vigil/scripts/test_validate_vigil_patch_trace.py
          python vigil/scripts/test_vigil_provenance_preservation.py
          python vigil/scripts/test_vigil_pipeline_state.py
          python -m unittest discover -s vigil/tests -p 'test_*.py'
          python vigil/scripts/route-vigil-records.py --check
          python vigil/scripts/validate-vigil-records.py
          python vigil/scripts/run-vigil-lifecycle-validation.py
          python vigil/scripts/validate-vigil-patch-trace.py --caelestis-root caelestis

      - name: Rebuild VIGIL indexes
        run: |
          python vigil/scripts/build-vigil-records.py
          python vigil/scripts/enrich-vigil-indexes.py

      - name: Commit consolidated branch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-consolidate-vigil-prs.yml
          find vigil -type d -name __pycache__ -prune -exec rm -rf {} +
          find vigil -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil .github/workflows/one-time-consolidate-vigil-prs.yml
          git commit -m "Consolidate VIGIL PR 45 into PR 43 and canonicalise PATCH-0031"
          git push origin HEAD:governance/proposal-source-and-patch-traceability
