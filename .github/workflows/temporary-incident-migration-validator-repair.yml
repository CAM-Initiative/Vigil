name: Temporary Incident migration validator repair

on:
  push:
    branches:
      - agent/bounded-incident-classification-provenance-repair
    paths:
      - ".github/workflows/temporary-incident-migration-validator-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bounded-incident-classification-provenance-repair
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Replace obsolete classification-prefix contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vigil/scripts/validate-incident-migration.py")
          text = path.read_text(encoding="utf-8")
          old = '''        taxonomy = record.get("taxonomy_classification", {})
          mappings = [taxonomy.get("primary_classification"), *taxonomy.get("secondary_classifications", [])]
          for mapping in mappings:
              if isinstance(mapping, dict) and not str(mapping.get("classification_basis", "")).startswith("In this Incident,"):
                  errors.append(f"{incident_id}: classification mapping basis is not Incident-specific")
'''
          new = '''        taxonomy = record.get("taxonomy_classification", {})
          mappings = [taxonomy.get("primary_classification"), *taxonomy.get("secondary_classifications", [])]
          if taxonomy.get("classification_status") == "classified":
              occurrence_basis = str(taxonomy.get("classification_basis", "")).strip()
              provenance = taxonomy.get("classification_review_provenance", {})
              authority_boundary = str(provenance.get("authority_boundary", "")).strip() if isinstance(provenance, dict) else ""
              if not occurrence_basis:
                  errors.append(f"{incident_id}: classified Incident lacks an occurrence-level classification basis")
              if "occurrence" not in (occurrence_basis + " " + authority_boundary).casefold():
                  errors.append(f"{incident_id}: classification provenance does not establish occurrence-level scope")
          for mapping in mappings:
              if isinstance(mapping, dict) and not str(mapping.get("classification_basis", "")).strip():
                  errors.append(f"{incident_id}: classification mapping lacks a substantive basis")
'''
          if old not in text:
              raise SystemExit("Expected obsolete Incident-specific prefix validator block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit validator repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/scripts/validate-incident-migration.py
          git commit -m "fix: validate occurrence-scoped Incident classification semantically"
          git push origin HEAD:agent/bounded-incident-classification-provenance-repair
