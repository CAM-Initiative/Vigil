name: EXTREQ-07 IEEE 7009 inspection

on:
  push:
    branches:
      - agent/extreq-05-ieee-7014-1-fidelity-review
    paths:
      - .github/workflows/extreq07-ieee-7009-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Print compact IEEE 7009 corpus inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('vigil/external_governance/requirements/requirements/IEEE-7009/2024.json')
          records=json.loads(p.read_text())
          print(f'COUNT={len(records)}')
          for r in records:
              print('\t'.join([r['requirement_id'], r['clause_or_control'], r['identity_key'], r['requirement_summary']]))
          ledger=json.loads(Path('vigil/external_governance/requirements/metadata-review.json').read_text())
          ids={r['requirement_id'] for r in records}
          entries=[e for e in ledger['entries'] if e['requirement_id'] in ids]
          print(f'LEDGER_COUNT={len(entries)}')
          from collections import Counter
          c=Counter()
          for e in entries:
              for k,v in e['field_status'].items(): c[(k,v)] += 1
          for (k,v),n in sorted(c.items()): print(f'STATUS\t{k}\t{v}\t{n}')
          PY
      - name: Prepare review context artifact
        run: |
          mkdir -p extreq07-context/vigil/scripts extreq07-context/vigil/tests extreq07-context/vigil/external_governance
          cp -R vigil/external_governance/requirements extreq07-context/vigil/external_governance/
          cp vigil/scripts/external_requirements_io.py extreq07-context/vigil/scripts/
          cp vigil/scripts/manage-external-requirements.py extreq07-context/vigil/scripts/
          cp vigil/scripts/validate-external-requirement-metadata.py extreq07-context/vigil/scripts/
          cp vigil/scripts/validate-external-requirement-fidelity.py extreq07-context/vigil/scripts/
          cp vigil/tests/test_external_requirement_metadata.py extreq07-context/vigil/tests/
          cp vigil/tests/test_external_requirement_fidelity.py extreq07-context/vigil/tests/
          cp vigil/tests/test_external_requirements.py extreq07-context/vigil/tests/
          cp vigil/tests/test_external_sources.py extreq07-context/vigil/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: extreq07-context
          path: extreq07-context
          if-no-files-found: error
