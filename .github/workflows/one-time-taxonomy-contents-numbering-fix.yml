name: One-time taxonomy contents numbering fix

on:
  push:
    branches:
      - agent/hugging-face-authority-reconciliation
    paths:
      - ".github/workflows/one-time-taxonomy-contents-numbering-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Remove duplicate contents numbering
        run: |
          python vigil/scripts/one-time-taxonomy-contents-numbering-fix.py
          python -m py_compile vigil/taxonomy/render_taxonomy.py

      - name: Generate publication
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify contents numbering and PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('vigil/taxonomy/render_taxonomy.py').read_text(encoding='utf-8')
          if '<strong>{chapter_number}. {esc(family[\'name\'])}</strong>' in source:
              raise SystemExit('manual top-level chapter number still present')
          pdf = Path('vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf')
          if not pdf.exists() or pdf.stat().st_size < 5000 or not pdf.read_bytes().startswith(b'%PDF-'):
              raise SystemExit('taxonomy PDF was not generated correctly')
          print(f'PDF: {pdf.stat().st_size:,} bytes')
          PY

      - name: Upload PDF for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-final-polish-pdf
          path: vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if-no-files-found: error

      - name: Commit renderer and generated publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/taxonomy/render_taxonomy.py
          git add vigil/taxonomy/generated/*.html
          git add vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if git diff --cached --quiet; then
            echo "Contents numbering already current."
          else
            git commit -m "Fix taxonomy contents chapter numbering"
            git push
          fi
