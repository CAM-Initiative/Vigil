name: VIGIL records

on:
  push:
    branches:
      - main
      # Dedicated canonical Incident allocation branch must keep derived outputs current.
      - agent/incident-ecosystem-ingestion
    paths:
      - "vigil/**"
      - ".github/workflows/vigil-records.yml"
      - ".gitignore"
  pull_request:
    # Release declarations live in PR descriptions; edits must rerun the publication guard.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - "vigil/**"
      - ".github/workflows/vigil-records.yml"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: vigil-records-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false
          # The publication guard compares the exact published main and head commits.
          # The main-only manifest requires first-parent per-record Git history.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # The complete unittest discovery imports jsonschema in tests that the
      # historical subset jobs never exercised. Install the pinned test dependency.
      - name: Install full-suite validation dependency
        run: python -m pip install "jsonschema==4.26.0"

      # A PR into the ingestion branch is authoring state, not a public Incident release.
      # Only final PRs to main declare revisions; this step NEVER edits records.
      - name: Validate per-Incident publication versions on final main PR
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin main "$PR_HEAD_SHA"
          python vigil/scripts/check-incident-publication-versions.py \
            --event "$GITHUB_EVENT_PATH" --repo .

      - name: Diagnose committed public index freshness before rebuilding
        run: |
          if python vigil/scripts/validate-vigil-public-records.py; then
            echo "Committed Incident projection matches canonical records."
          else
            echo "::warning::Committed Incident projection was stale before the deterministic rebuild; this is diagnostic only."
          fi

      - name: Refresh Incident-only public VIGIL indexes for validation
        run: python vigil/scripts/build-vigil-public-records.py

      - name: Build sparse HIM sidecar alongside Incident registry
        run: python vigil/scripts/build-vigil-public-records.py

      - name: Build canonical-field jurisdiction projection
        run: python vigil/scripts/build-vigil-jurisdiction-index.py

      - name: Verify sparse HIM sidecar is identical after a second build
        run: |
          cp vigil/VIGIL.Harm.Dimensions.Index.json /tmp/vigil-harm-sidecar.json
          python vigil/scripts/build-vigil-public-records.py
          cmp /tmp/vigil-harm-sidecar.json vigil/VIGIL.Harm.Dimensions.Index.json

      - name: Verify jurisdiction projection is deterministic
        run: python vigil/scripts/build-vigil-jurisdiction-index.py --check

      - name: Test source provenance classification
        run: python vigil/tests/test_vigil_source_provenance.py

      - name: Validate active source provenance
        run: python vigil/scripts/validate-vigil-source-provenance.py

      - name: Test VIGIL record validator rules
        run: python vigil/tests/test_validate_vigil_record_rules.py

      - name: Test opt-in source-episode and EXTREQ reference integrity
        run: python vigil/tests/test_source_episode_integrity.py

      - name: Test public Case File prose quality
        run: python vigil/tests/test_public_prose_quality.py

      - name: Test active VIGIL pipeline state
        run: python vigil/tests/test_vigil_pipeline_state.py

      - name: Test and validate VIGIL authorship provenance
        run: |
          python vigil/tests/test_authorship_provenance.py
          python vigil/scripts/validate-authorship-provenance.py

      # Keep the approval-gated publication checks independently observable,
      # even when unrelated legacy corpus assertions fail during discovery.
      - name: Test isolated Incident publication versioning and Git history
        run: python vigil/tests/test_incident_publication_versions.py

      - name: Test full VIGIL corpus and maintenance contracts
        run: python -m unittest discover -s vigil/tests -p 'test_*.py'

      - name: Validate active system-component metadata
        run: python vigil/scripts/validate-vigil-system-components.py

      - name: Validate Incident interpretive provenance
        run: python vigil/scripts/validate-vigil-interpretive-provenance.py

      - name: Validate Incident-only public registry
        run: |
          python vigil/scripts/validate-vigil-records.py
          python vigil/scripts/validate-vigil-public-records.py

      - name: Rebuild Incident-only public VIGIL indexes
        run: python vigil/scripts/build-vigil-public-records.py

      # The raw case-study index may include interaction-only source records.
      # Apply the same publication eligibility filter before comparing or
      # committing the maintained textbook examples, not only in the PDF job.
      - name: Apply textbook case-study publication eligibility filter
        run: |
          python vigil/taxonomy/filter_publication_case_examples.py
          python vigil/taxonomy/filter_publication_case_examples.py --check

      - name: Verify source records and canonical record contract were not mutated
        run: |
          if ! git diff --quiet -- vigil/records vigil/templates vigil/VIGIL.Schema.json; then
            echo "Validation/build automation modified governed source records or the canonical record contract."
            git diff --name-status -- vigil/records vigil/templates vigil/VIGIL.Schema.json
            exit 1
          fi

      - name: Build and verify main-published Incident revision manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python vigil/scripts/build-incident-publication-manifest.py
          python vigil/scripts/build-incident-publication-manifest.py --check

      # PR and ingestion-branch validation are read-only. Generated artifacts
      # must be committed by the author, avoiding a bot-written PR HEAD with
      # action_required / zero-job check runs.
      # One-off generated-output publication for approved Gate 2 version reconciliation.
      # Removed immediately after the version-index refresh is committed.
      - name: Commit approved regenerated Incident projections once
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/agent/incident-ecosystem-ingestion' &&
          contains(github.event.head_commit.message, '[approved-gate2-publications]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            vigil/VIGIL.Incidents.Index.json \
            vigil/VIGIL.Harm.Dimensions.Index.json \
            vigil/VIGIL.Registry.Index.json \
            vigil/VIGIL.Incidents.Jurisdictions.Index.json \
            vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(vigil): rebuild versioned public Incident indexes [skip ci]"
            git push origin HEAD:agent/incident-ecosystem-ingestion
          fi

      - name: Require committed generated outputs on PR and working branches
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          if ! git diff --exit-code -- \
            vigil/VIGIL.Incidents.Index.json \
            vigil/VIGIL.Harm.Dimensions.Index.json \
            vigil/VIGIL.Registry.Index.json \
            vigil/VIGIL.Incidents.Jurisdictions.Index.json \
            vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json; then
            echo "::error::Generated public indexes differ from committed files. Rebuild and commit before review."
            exit 1
          fi
          # The dedicated Incident-ingestion branch must retain canonical
          # authoring continuity; this *new derived geography index only* is
          # maintained by the reproducible CI build, not a manual batch rewrite.
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ] || [ "$GITHUB_REF_NAME" != 'agent/incident-ecosystem-ingestion' ]; then
            if [ -n "$(git status --porcelain -- vigil/VIGIL.Incidents.Jurisdictions.Index.json)" ]; then
              echo "::error::Jurisdiction projection differs from canonical records; rebuild and commit."
              exit 1
            fi
          fi

      - name: Commit generated VIGIL outputs on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find vigil -type d -name __pycache__ -prune -exec rm -rf {} +
          find vigil -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add \
            vigil/VIGIL.Incidents.Index.json \
            vigil/VIGIL.Harm.Dimensions.Index.json \
            vigil/VIGIL.Registry.Index.json \
            vigil/VIGIL.Incidents.Publications.json \
            vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json
          if git diff --cached --quiet; then
            echo "No generated VIGIL output changes to commit."
          else
            git commit -m "Rebuild active public VIGIL registry indexes"
            if ! git push; then
              echo "Branch advanced while this run was building generated files; a newer workflow run owns generated-output refresh."
              exit 0
            fi
          fi

      - name: Commit geography projection on the dedicated ingestion branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/incident-ecosystem-ingestion'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/VIGIL.Incidents.Jurisdictions.Index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh canonical-field jurisdiction projection [skip ci]"
            if ! git push; then
              echo "::error::Ingestion branch advanced. Rebuild from current HEAD instead of overwriting concurrent work."
              exit 1
            fi
          fi

      # Cross-repository dispatch is a delivery mechanism, not a condition for
      # canonical validation or for building the maintained taxonomy PDF. A bad
      # external token must never suppress the downstream publication workflow.
      - name: Notify CAM catalogue of refreshed VIGIL records
        id: catalogue-dispatch
        continue-on-error: true
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]') ||
          github.event_name == 'workflow_dispatch'
        env:
          CAM_CATALOGUE_DISPATCH_TOKEN: ${{ secrets.CAM_CATALOGUE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$CAM_CATALOGUE_DISPATCH_TOKEN" ]; then
            echo "::error::CAM_CATALOGUE_DISPATCH_TOKEN is missing. Set this secret in CAM-Initiative/Vigil Actions repository secrets."
            exit 1
          fi

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $CAM_CATALOGUE_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/CAM-Initiative/cam-governance-catalogue/dispatches \
            --data '{"event_type":"vigil-records-updated","client_payload":{"source_repository":"CAM-Initiative/Vigil","source_ref":"main"}}'

      - name: Surface cross-repository delivery failure without blocking taxonomy publication
        if: steps.catalogue-dispatch.outcome == 'failure'
        run: |
          echo "::warning::CAM catalogue dispatch failed. Confirm CAM_CATALOGUE_DISPATCH_TOKEN exists in the VIGIL repository and is authorised for repository_dispatch on the CAM catalogue. Canonical VIGIL validation and taxonomy publication remain independent."
          echo "## Catalogue delivery warning" >> "$GITHUB_STEP_SUMMARY"
          echo "VIGIL validation succeeded, but the CAM catalogue notification failed. Inspect the dispatch step and rotate CAM_CATALOGUE_DISPATCH_TOKEN if expired; the catalogue also has scheduled reconciliation." >> "$GITHUB_STEP_SUMMARY"
