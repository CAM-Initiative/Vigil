name: Temporary restore taxonomy PDF publication contract documentation

on:
  push:
    branches:
      - agent/bounded-incident-classification-provenance-repair
    paths:
      - ".github/workflows/temporary-restore-taxonomy-pdf-doc-contract.yml"

permissions:
  contents: write

jobs:
  restore-doc-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bounded-incident-classification-provenance-repair
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Restore standing HTML/PDF publication contract wording
        run: |
          python - <<'PY'
          from pathlib import Path

          agents = Path("vigil/AGENTS.md")
          text = agents.read_text(encoding="utf-8")
          old = "Generated taxonomy HTML is a projection, not a second source of truth. The repository does not maintain a required PDF publication contract."
          new = "Generated taxonomy HTML/PDF are publication projections, not a second source of truth. Pull-request validation must not require committed publication artefacts to match branch-local regeneration; the main-branch publication workflow owns refreshed HTML/PDF generation and commit after source changes land."
          if old not in text:
              raise SystemExit("Expected HTML-only AGENTS publication wording not found")
          agents.write_text(text.replace(old, new), encoding="utf-8")

          readme = Path("vigil/taxonomy/README.md")
          text = readme.read_text(encoding="utf-8")
          old_arch = """generated/\n  one complete HTML page per family\n  VIGIL.FailureTaxonomy.FullReference.html\n"""
          new_arch = """generated/\n  one complete HTML page per family\n  VIGIL.FailureTaxonomy.FullReference.html\n  VIGIL.Observatory.FailureTaxonomy.FullReference.pdf\n"""
          if old_arch not in text:
              raise SystemExit("Expected generated publication architecture block not found")
          text = text.replace(old_arch, new_arch)

          old_gen = """Generate every complete family page and the combined full-reference HTML:\n\n```bash\npython vigil/taxonomy/render_taxonomy.py \\\n  --catalogue \\\n  --output-dir vigil/taxonomy/generated\n```\n\nHTML publications are deterministic projections of the canonical family JSON. They are generated rather than hand-edited. The publication workflow validates the taxonomy contract, rebuilds the Incident-backed Case File projection, applies evidence exclusions, regenerates HTML, and verifies that the Full Reference HTML is non-empty. On `main`, the workflow commits refreshed HTML outputs. Pull requests validate regeneration without requiring generated publication files to be pre-committed on the branch.\n\nThe repository no longer maintains a PDF publication contract. PDF rendering may remain available as an optional local renderer capability, but PDF artefacts are not a required, validated, or automatically committed publication surface.\n"""
          new_gen = """Generate every complete family page and the combined full-reference HTML locally:\n\n```bash\npython vigil/taxonomy/render_taxonomy.py \\\n  --catalogue \\\n  --output-dir vigil/taxonomy/generated\n```\n\nGenerate the maintained Full Reference HTML and PDF publication set with:\n\n```bash\npython vigil/taxonomy/render_taxonomy.py \\\n  --catalogue \\\n  --output-dir vigil/taxonomy/generated \\\n  --pdf\n```\n\nHTML and PDF publications are deterministic projections of the canonical family JSON. They are generated rather than hand-edited. Pull requests validate the taxonomy contract, rebuild the Incident-backed Case File projection, apply evidence exclusions, and prove that the HTML publication renders cleanly without requiring branch-local generated publication artefacts to match committed outputs. After changes land on `main`, the publication workflow uses the repository's established PDF renderer to regenerate, validate, and commit the refreshed HTML and PDF assets. The maintained PDF therefore remains a durable publication asset without becoming a pull-request staleness gate or a second source of truth.\n"""
          if old_gen not in text:
              raise SystemExit("Expected HTML-only README generation contract not found")
          readme.write_text(text.replace(old_gen, new_gen), encoding="utf-8")
          PY

      - name: Commit publication contract documentation repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/AGENTS.md vigil/taxonomy/README.md
          git commit -m "docs: restore main-owned taxonomy PDF publication contract"
          git push origin HEAD:agent/bounded-incident-classification-provenance-repair
