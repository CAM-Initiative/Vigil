name: Reconcile external source disposition semantics

on:
  push:
    branches:
      - agent/instrumental-coercive-influence-capability-revalidation
    paths:
      - .github/workflows/reconcile-source-disposition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Replace ambiguous source review state with source disposition state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def dump(path, value):
              Path(path).write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          scope = load('vigil/external_requirements/source-scope.json')
          scoped = {(x['vigil_source_id'], x['source_version']) for x in scope['entries']}

          registry_path = Path('vigil/external_sources/source-registry.json')
          registry = load(registry_path)
          registered = {(x['vigil_source_id'], x['source_version']) for x in registry['entries']}
          if scoped != registered:
              raise SystemExit('Source-scope disposition is not one-to-one with current source registry.')
          for entry in registry['entries']:
              eligible = bool(entry.pop('review_eligible'))
              entry.pop('review_state')
              entry['disposition_eligible'] = eligible
              entry['disposition_state'] = 'dispositioned'
          dump(registry_path, registry)

          def transform(value):
              key_map = {
                  'review_state': 'disposition_state',
                  'review_eligible': 'disposition_eligible',
                  'review_eligible_states': 'disposition_eligible_states',
                  'drafts_enter_source_review_queue': 'drafts_enter_source_disposition_queue',
              }
              string_map = {
                  'unassigned': 'monitoring',
                  'review-required': 'pending',
                  'reviewed': 'dispositioned',
                  'superseded-before-review': 'superseded-before-disposition',
                  'source-review workflow': 'source-disposition workflow',
                  'source-review queue': 'source-disposition queue',
              }
              if isinstance(value, dict):
                  return {key_map.get(k, k): transform(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [transform(v) for v in value]
              if isinstance(value, str):
                  for old, new in string_map.items():
                      value = value.replace(old, new)
                  return value
              return value

          schema_path = 'vigil/external_sources/source-registry.schema.json'
          dump(schema_path, transform(load(schema_path)))
          matrix_path = 'vigil/external_sources/source-matrix.json'
          dump(matrix_path, transform(load(matrix_path)))

          manager_path = Path('vigil/scripts/manage-external-sources.py')
          text = manager_path.read_text(encoding='utf-8')
          replacements = [
              ('source-review workflow', 'source-disposition workflow'),
              ('source-review-queue.json', 'source-disposition-queue.json'),
              ('REVIEW_STATES', 'DISPOSITION_STATES'),
              ('review_eligible_states', 'disposition_eligible_states'),
              ('review_eligible', 'disposition_eligible'),
              ('review_state', 'disposition_state'),
              ('"unassigned"', '"monitoring"'),
              ('"review-required"', '"pending"'),
              ('"reviewed"', '"dispositioned"'),
              ('"superseded-before-review"', '"superseded-before-disposition"'),
              ('semantic-source-review', 'source-scope-disposition'),
              ('Review state', 'Disposition state'),
              ('review-required', 'pending'),
              ('source review queue', 'source disposition queue'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          manager_path.write_text(text, encoding='utf-8')

          test_path = Path('vigil/tests/test_external_sources.py')
          text = test_path.read_text(encoding='utf-8')
          replacements = [
              ('review_eligible_states', 'disposition_eligible_states'),
              ('review_eligible', 'disposition_eligible'),
              ('review_state', 'disposition_state'),
              ('review_queue', 'disposition_queue'),
              ('review_disposition', 'source_disposition'),
              ('reopens_review', 'reopens_disposition'),
              ('"unassigned"', '"monitoring"'),
              ('"review-required"', '"pending"'),
              ('"reviewed"', '"dispositioned"'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          test_path.write_text(text, encoding='utf-8')

          readme_path = Path('vigil/external_sources/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('source-review workflow state', 'source-disposition workflow state')
          readme = readme.replace(
              '`review_state` is VIGIL source-review workflow state. It is not a CAM applicability, conformance or coverage finding.',
              '`disposition_state` records whether a registered source/version has received an explicit source-scope disposition in `../external_requirements/source-scope.json`. `dispositioned` does **not** mean the primary text was fully extracted, substantively human-reviewed or source-verified; access, extraction and assurance are represented separately in the external-requirements corpus. It is not a CAM applicability, conformance or coverage finding.'
          )
          readme = readme.replace('source-review-queue.json` — generated source-review queue.', 'source-disposition-queue.json` — generated queue of source versions awaiting source-scope disposition.')
          readme_path.write_text(readme, encoding='utf-8')

          provenance_validator = Path('vigil/scripts/validate-authorship-provenance.py')
          text = provenance_validator.read_text(encoding='utf-8').replace('external_sources/source-review-queue.json', 'external_sources/source-disposition-queue.json')
          provenance_validator.write_text(text, encoding='utf-8')

          old_queue = Path('vigil/external_sources/source-review-queue.json')
          if old_queue.exists():
              old_queue.unlink()
          PY

      - name: Rebuild and validate source and requirement corpus
        run: |
          python -m py_compile vigil/scripts/manage-external-sources.py vigil/tests/test_external_sources.py
          python vigil/scripts/manage-external-sources.py build
          python vigil/scripts/manage-external-sources.py validate --check-generated
          python vigil/tests/test_external_sources.py
          python vigil/scripts/manage-external-requirements.py build
          python vigil/scripts/manage-external-requirements.py validate --check-generated
          python vigil/tests/test_external_requirements.py
          python vigil/tests/test_cam_assessments.py
          python vigil/scripts/validate-cam-assessments.py
          python vigil/tests/test_authorship_provenance.py
          python vigil/scripts/validate-authorship-provenance.py

      - name: Verify current disposition semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('vigil/external_sources/source-registry.json').read_text(encoding='utf-8'))
          queue = json.loads(Path('vigil/external_sources/source-disposition-queue.json').read_text(encoding='utf-8'))
          assert len(registry['entries']) == 81
          assert all(x['disposition_state'] == 'dispositioned' for x in registry['entries'])
          assert queue['items'] == []
          for path in (
              'vigil/external_sources/source-registry.json',
              'vigil/external_sources/source-registry.schema.json',
              'vigil/external_sources/source-matrix.json',
              'vigil/external_sources/README.md',
              'vigil/external_sources/SOURCE-CATALOGUE.md',
              'vigil/scripts/manage-external-sources.py',
              'vigil/tests/test_external_sources.py',
          ):
              text = Path(path).read_text(encoding='utf-8')
              for token in ('review_state', 'review_eligible', 'source-review-queue.json', 'Review state'):
                  if token in text:
                      raise SystemExit(f'{path}: residual ambiguous token {token}')
          PY

      - name: Commit reconciled source disposition semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git status --short
          git commit -m "Clarify external source disposition state"
          git push origin HEAD:"${GITHUB_REF_NAME}"

# execution trigger
