name: One-time taxonomy textbook layout

on:
  push:
    branches:
      - agent/hugging-face-authority-reconciliation
    paths:
      - ".github/workflows/one-time-taxonomy-textbook-layout.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hugging-face-authority-reconciliation
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Apply textbook publication layout
        run: python vigil/scripts/one-time-taxonomy-textbook-layout.py

      - name: Generate and verify full textbook
        run: |
          rm -rf /tmp/taxonomy-textbook-test
          python vigil/taxonomy/render_taxonomy.py --catalogue --output-dir /tmp/taxonomy-textbook-test --pdf
          python - <<'PY'
          from pathlib import Path
          html = Path('/tmp/taxonomy-textbook-test/VIGIL.FailureTaxonomy.FullReference.html')
          pdf = Path('/tmp/taxonomy-textbook-test/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf')
          if not html.exists() or not pdf.exists() or not pdf.read_bytes().startswith(b'%PDF-'):
              raise SystemExit('Textbook publication did not generate correctly')
          text = html.read_text(encoding='utf-8')
          required = ['Chapter 1', 'Scope &amp; chapter map', '1.1', 'Case Studies', 'What happened']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing textbook markers: {missing}')
          forbidden = ['VIGIL Observatory Case File classifications', 'Design intent', 'Design note']
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'Historical/prototype labels remain: {present}')
          print(f'PDF: {pdf.stat().st_size:,} bytes')
          PY

      - name: Verify bounded source change
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "vigil/taxonomy/render_taxonomy.py" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit textbook renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/taxonomy/render_taxonomy.py
          git commit -m "Format taxonomy publication as technical textbook"
          git push
