name: VIGIL records

on:
  push:
    branches:
      - main
    paths:
      - "vigil/**"
      - ".github/workflows/vigil-records.yml"
      - ".gitignore"
  pull_request:
    paths:
      - "vigil/**"
      - ".github/workflows/vigil-records.yml"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: vigil-records-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Refresh active public VIGIL registry indexes for validation
        run: |
          python vigil/scripts/build-vigil-public-records.py
          python vigil/scripts/enrich-vigil-indexes.py

      - name: Test source provenance classification
        run: python vigil/tests/test_vigil_source_provenance.py

      - name: Validate source provenance
        run: python vigil/scripts/validate-vigil-source-provenance.py

      - name: Test VIGIL record validator rules
        run: python vigil/tests/test_validate_vigil_record_rules.py

      - name: Test VIGIL lifecycle validator
        run: python vigil/tests/test_validate_vigil_lifecycle.py

      - name: Test VIGIL PATCH trace validator
        run: python vigil/tests/test_validate_vigil_patch_trace.py

      - name: Test VIGIL provenance preservation
        run: python vigil/tests/test_vigil_provenance_preservation.py

      - name: Test VIGIL pipeline state
        run: python vigil/tests/test_vigil_pipeline_state.py

      - name: Test withdrawn record-class publication boundary
        run: python vigil/tests/test_validate_vigil_learn_records.py

      - name: Test and validate VIGIL authorship provenance
        run: |
          python vigil/tests/test_authorship_provenance.py
          python vigil/scripts/validate-authorship-provenance.py

      - name: Test VIGIL registry builder
        run: python vigil/tests/test_build_vigil_records.py

      - name: Test VIGIL record routing
        run: python vigil/tests/test_route_vigil_records.py

      - name: Check VIGIL record routing
        run: python vigil/scripts/route-vigil-records.py --check

      - name: Validate active public VIGIL records
        run: |
          python vigil/scripts/validate-vigil-public-records.py
          python vigil/scripts/validate-vigil-system-components.py

      - name: Validate Incident migration and legacy crosswalk
        run: |
          python vigil/scripts/build-incident-registry.py
          python vigil/scripts/build-vigil-records.py --taxonomy-examples-only
          python vigil/tests/test_incident_registry.py
          python vigil/scripts/build-incident-migration-decisions.py
          python vigil/scripts/build-incident-migration-crosswalk.py
          python vigil/scripts/validate-incident-migration.py
          git diff --exit-code -- \
            vigil/migrations/incident-registry/Incident.Migration.Decisions.json \
            vigil/migrations/incident-registry/VIGIL.FM-OBS-to-INC.Crosswalk.json

      - name: Validate VIGIL lifecycle, corpus coverage, CAM boundary, and interpretive provenance
        run: python vigil/scripts/run-vigil-lifecycle-validation.py

      - name: Build and enrich active public VIGIL registry indexes
        run: |
          python vigil/scripts/build-vigil-public-records.py
          python vigil/scripts/enrich-vigil-indexes.py

      - name: Verify source records and canonical record contract were not mutated
        run: |
          if ! git diff --quiet -- vigil/records vigil/templates vigil/VIGIL.Schema.json; then
            echo "Validation/build automation modified governed source records or the canonical record contract."
            git diff --name-status -- vigil/records vigil/templates vigil/VIGIL.Schema.json
            exit 1
          fi

      - name: Commit generated VIGIL outputs
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find vigil -type d -name __pycache__ -prune -exec rm -rf {} +
          find vigil -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add \
            vigil/VIGIL.Incidents.Index.json \
            vigil/VIGIL.Observations.Index.json \
            vigil/VIGIL.Research.Index.json \
            vigil/VIGIL.Registry.Index.json \
            vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json
          if git diff --cached --quiet; then
            echo "No generated VIGIL output changes to commit."
          else
            git commit -m "Rebuild active public VIGIL registry indexes"
            if ! git push; then
              echo "Branch advanced while this run was building generated files; a newer workflow run owns generated-output refresh."
              exit 0
            fi
          fi
