name: Temporary bounded Incident classification reconciliation

on:
  push:
    branches:
      - agent/bounded-incident-classification-provenance-repair

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile five Incident records
        shell: bash
        run: |
          git fetch origin stabilization/pre-fm-schema-migration:refs/remotes/origin/stabilization/pre-fm-schema-migration
          python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          DATE = "2026-08-30"
          TAXONOMY_VERSION = "0.2.3-draft"
          LEGACY_REF = "origin/stabilization/pre-fm-schema-migration"

          legacy_paths = {
              "VIGIL-2026-FM-0023": "vigil/records/failures/2026/VIGIL-2026-FM-0023.json",
              "VIGIL-2026-FM-0032": "vigil/records/failures/2026/VIGIL-2026-FM-0032.json",
              "VIGIL-2026-FM-0036": "vigil/records/failures/2026/VIGIL-2026-FM-0036.json",
              "VIGIL-2026-FM-0064": "vigil/records/failures/2026/VIGIL-2026-FM-0064.json",
          }

          incident_paths = {
              "036": Path("vigil/records/incidents/VIGIL-INC-000036.json"),
              "037": Path("vigil/records/incidents/VIGIL-INC-000037.json"),
              "043": Path("vigil/records/incidents/VIGIL-INC-000043.json"),
              "045": Path("vigil/records/incidents/VIGIL-INC-000045.json"),
              "064": Path("vigil/records/incidents/VIGIL-INC-000064.json"),
          }

          legacy_for_incident = {
              "036": "VIGIL-2026-FM-0023",
              "037": "VIGIL-2026-FM-0023",
              "043": "VIGIL-2026-FM-0032",
              "045": "VIGIL-2026-FM-0036",
              "064": "VIGIL-2026-FM-0064",
          }

          outcomes = {
              "036": "Reclassified the incident from Transformation Lineage Collapse to Unsupported Mechanism Attribution; the visible evidence supports an over-specific refusal explanation but does not establish hidden prompt-transformation loss.",
              "037": "Removed the unsupported Transformation Lineage Collapse mapping and returned the incident to unclassified status pending recoverable primary evidence.",
              "043": "Reclassified the provider-acknowledged policy-violating harmful output as Required Control Non-Activation rather than Target and Scope Authority Transposition.",
              "045": "Retained Delegation Scope Expansion as primary and added Technical Reachability Mistaken for Authority as an independently evidenced secondary mechanism.",
              "064": "Retained Identity Representation Authority Conflation as primary and added Required Control Non-Activation for the independently evidenced minor-derived sexual-safety failure.",
          }

          limitations = {
              "036": [
                  "The preserved evidence is anecdotal and does not expose the hidden classifier, transformed prompt, renderer state, or root cause.",
                  "The review does not assert that the refusal itself was necessarily unwarranted; it corrects the unsupported mechanism attribution shown to the user."
              ],
              "037": [
                  "The public post was not independently available for full inspection in the preserved review path.",
                  "The complete prompt, transformed prompt, refusal rationale, classifier state, and runtime cause remain unverified."
              ],
              "043": [
                  "Public evidence establishes the harmful output and provider acknowledgement but not which internal safeguard layer failed.",
                  "The affected user is described as a graduate student; this classification is not framed as a child-protection incident."
              ],
              "045": [
                  "The reviewing record relies on public reporting of wire-level testing and did not independently reproduce the packet capture.",
                  "The classification does not establish the disposition of previously transferred data."
              ],
              "064": [
                  "The public evidence does not identify the internal safety control or precise activation point that failed.",
                  "No abusive output was reproduced; the review relies on directly reviewed reporting about the source-image age and generation behaviour."
              ],
          }

          def load_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save_json(path, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          def load_legacy(legacy_id):
              path = legacy_paths[legacy_id]
              raw = subprocess.check_output(["git", "show", f"{LEGACY_REF}:{path}"], text=True)
              return json.loads(raw)

          def review_key(review):
              return review.get("review_id") or json.dumps(review, sort_keys=True, ensure_ascii=False)

          def restore_provenance(rec, key):
              legacy_id = legacy_for_incident[key]
              legacy = load_legacy(legacy_id)

              diagnostic = copy.deepcopy(legacy.get("diagnostic_provenance", {}))
              diagnostic["legacy_source_id"] = legacy_id
              diagnostic["provenance_scope"] = (
                  "Historical diagnostic provenance inherited from the pre-migration Failure Mode analysis. "
                  "Current Incident taxonomy classification is governed separately by taxonomy_classification.classification_review_provenance."
              )
              rec["diagnostic_provenance"] = diagnostic

              reviews = []
              seen = set()

              for review in legacy.get("interpretive_provenance", {}).get("review_history", []):
                  item = copy.deepcopy(review)
                  item.setdefault("provenance_scope", "legacy-failure-mode-review")
                  item.setdefault("legacy_source_id", legacy_id)
                  k = review_key(item)
                  if k not in seen:
                      reviews.append(item)
                      seen.add(k)

              existing = rec.get("interpretive_provenance", {})
              existing_reviews = list(existing.get("review_history", []))
              if existing.get("current_ai_review"):
                  existing_reviews.append(existing["current_ai_review"])
              for review in existing_reviews:
                  item = copy.deepcopy(review)
                  item.setdefault("provenance_scope", "incident-migration-or-post-migration-review")
                  k = review_key(item)
                  if k not in seen:
                      reviews.append(item)
                      seen.add(k)

              current = {
                  "review_id": f"VIGIL-REVIEW-2026-08-30-SOL-INC-000{key}-CLASSIFICATION-RECONCILIATION",
                  "reviewer_type": "human-directed AI analytical review",
                  "reviewer_platform": "OpenAI ChatGPT with GitHub connector",
                  "reviewer_model": "GPT-5.6 Sol",
                  "review_date": DATE,
                  "review_scope": "Bounded Incident taxonomy-classification, metadata and provenance reconciliation against taxonomy 0.2.3-draft and the frozen pre-migration source record.",
                  "capability_profile": {
                      "direct_text_analysis": True,
                      "direct_repository_analysis": True,
                      "direct_static_image_analysis": False,
                      "direct_audio_analysis_in_this_pass": False,
                      "direct_uploaded_video_analysis_in_this_pass": False,
                      "direct_externally_hosted_video_analysis": False,
                      "web_link_and_metadata_review": False
                  },
                  "known_limitations": limitations[key],
                  "review_outcome": outcomes[key],
                  "provenance_scope": "incident-classification-reconciliation"
              }
              k = review_key(current)
              if k not in seen:
                  reviews.append(current)
              rec["interpretive_provenance"] = {
                  "review_history": reviews,
                  "current_ai_review": current
              }

          def set_common(rec, key):
              rec["record_identity"]["updated"] = DATE
              rec["record_identity"]["version"] = "0.2.2"
              rec["taxonomy_classification"]["taxonomy_version"] = TAXONOMY_VERSION
              rec["taxonomy_classification"]["classification_review_provenance"] = {
                  "method": "bounded-human-directed-incident-taxonomy-reconciliation",
                  "review_date": DATE,
                  "reviewer": "Dr M.V O'Rourke with OpenAI ChatGPT — GPT-5.6 Sol analytical support",
                  "review_status": "human-directed correction implemented",
                  "authority_boundary": (
                      "This is an Incident-level VIGIL classification judgement bounded by preserved evidence. "
                      "Historical Failure Mode diagnosis is retained as provenance and does not automatically confer current taxonomy membership."
                  )
              }
              restore_provenance(rec, key)

          # INC-000036
          rec = load_json(incident_paths["036"])
          set_common(rec, "036")
          rec["vigil_assessment"]["governance_interpretation"] = (
              "The visible refusal attributed the block to harassment, discrimination, or bullying, but the preserved visible prompt evidence does not establish that specific causal or policy mechanism. The hidden classifier, transformed-prompt, earlier-context, renderer, or fallback-routing state remains unresolved."
          )
          rec["vigil_assessment"]["significance_to_cam"] = (
              "For CAM, this occurrence shows that a refusal explanation can overstate mechanism certainty when the evidence available to the user does not support the stated misconduct category. Governance should preserve uncertainty and distinguish the observed refusal outcome from an inferred causal mechanism."
          )
          rec["vigil_assessment"].setdefault("assessment_boundaries", [])
          boundary = "The evidence does not establish that the refusal itself was necessarily unwarranted; it establishes that the stated misconduct mechanism is unsupported by the preserved visible evidence."
          if boundary not in rec["vigil_assessment"]["assessment_boundaries"]:
              rec["vigil_assessment"]["assessment_boundaries"].append(boundary)
          src = rec["source_records"][0]
          src["relevance_note"] = (
              "Direct anecdotal evidence for an unsupported refusal-mechanism attribution: the visible refusal names harassment, discrimination, or bullying while the preserved visible prompt does not establish that category. The source does not establish the hidden classifier or transformed-prompt state."
          )
          src["interpretive_reliance"] = (
              "Used only to assess the user-facing mechanism attribution; not used to infer the hidden classifier, transformed prompt, renderer state, or root cause."
          )
          rec["taxonomy_classification"].update({
              "classification_status": "classified",
              "classification_basis": (
                  "The preserved incident evidence supports a specific user-facing causal or policy attribution that is not traceable to the visible prompt evidence. It does not establish loss of transformation lineage as the operative mechanism."
              ),
              "primary_classification": {
                  "family_id": "VIGIL-FF-0002",
                  "class_id": "VIGIL-FC-000047",
                  "classification_basis": (
                      "The system presented harassment, discrimination, or bullying as the mechanism for the refusal even though the preserved visible prompt and available transformation evidence do not support that specific attribution and material alternatives remain unresolved."
                  ),
                  "classification_confidence": "medium"
              },
              "secondary_classifications": []
          })
          rec["linked_records"]["related_patch_notes"] = []
          rec["cam_internal"]["proposal_needed"] = "to be assessed against current canonical CAM/Caelestis coverage after incident-level classification correction"
          rec["cam_internal"]["routing_note"] = (
              "Assess current CAM/Caelestis coverage against the corrected Unsupported Mechanism Attribution diagnosis. Do not depend on legacy VIGIL PATCH records; preserve the refusal outcome, the unsupported user-facing mechanism attribution, and the unresolved hidden runtime cause as separate states."
          )
          save_json(incident_paths["036"], rec)

          # INC-000037
          rec = load_json(incident_paths["037"])
          set_common(rec, "037")
          rec["vigil_assessment"]["governance_interpretation"] = (
              "The preserved report indicates a possible prompt-rewrite and refusal concern, but the primary post was not independently available for full review. The available record does not establish the complete prompt, transformed prompt, refusal rationale, classifier state, or runtime mechanism strongly enough to assign a reusable Failure Class."
          )
          rec["vigil_assessment"]["significance_to_cam"] = (
              "For CAM, this occurrence should remain evidence-pending rather than being forced into a taxonomy bucket. Reliable classification requires recoverable primary evidence sufficient to distinguish prompt transformation, refusal explanation, classifier behaviour, and other possible runtime causes."
          )
          rec["vigil_assessment"].setdefault("assessment_boundaries", [])
          boundary = "FC47 Unsupported Mechanism Attribution remains a candidate only if recovered primary evidence confirms that a specific refusal mechanism was asserted without adequate evidentiary support."
          if boundary not in rec["vigil_assessment"]["assessment_boundaries"]:
              rec["vigil_assessment"]["assessment_boundaries"].append(boundary)
          src = rec["source_records"][0]
          src["relevance_note"] = (
              "Potential anecdotal evidence for a prompt-rewrite/refusal event. The current record is insufficient to establish Transformation Lineage Collapse or another reusable mechanism; authenticated screenshot or archive evidence is required before classification."
          )
          src["interpretive_reliance"] = (
              "Used only to preserve the existence of the reported concern and source locator; not used as proof of the complete prompt, transformation chain, refusal mechanism, classifier state, or runtime cause."
          )
          rec["taxonomy_classification"].update({
              "classification_status": "unclassified",
              "classification_basis": (
                  "The preserved evidence is insufficient to establish a specific recurring mechanism. The prior Transformation Lineage Collapse mapping overstated what could be inferred from an inaccessible primary post."
              ),
              "primary_classification": None,
              "secondary_classifications": []
          })
          rec["taxonomy_classification"]["classification_review_provenance"]["review_status"] = "human-directed correction implemented; classification deliberately unresolved"
          rec["linked_records"]["related_patch_notes"] = []
          rec["cam_internal"]["proposal_needed"] = "no classification-dependent proposal until primary evidence is recovered and the Incident mechanism is established"
          rec["cam_internal"]["routing_note"] = (
              "Recover authenticated or archived primary evidence before assigning a Failure Class. Do not depend on legacy VIGIL PATCH records or the former FM-0023 transformation theory as current Incident authority."
          )
          save_json(incident_paths["037"], rec)

          # INC-000043
          rec = load_json(incident_paths["043"])
          set_common(rec, "043")
          rec["evidence_confidence"] = "corroborated"
          rec["vigil_assessment"]["governance_interpretation"] = (
              "During an ordinary educational assistance exchange, Gemini produced an instruction for the user to die. Google subsequently acknowledged that the response violated policy. The incident therefore supports a failure of an applicable harmful-output safeguard to activate or prevent the response, rather than a transfer of authority between targets or scopes."
          )
          rec["vigil_assessment"]["significance_to_cam"] = (
              "For CAM, the occurrence demonstrates an under-governance failure: a provider-acknowledged policy-violating harmful response reached the user in a context where the applicable safety boundary should have prevented, redirected, or otherwise governed the output."
          )
          rec["vigil_assessment"].setdefault("assessment_boundaries", [])
          boundary = "Public evidence does not establish which internal safeguard layer failed or whether non-activation occurred at classifier, policy, generation, or output-filter stage."
          if boundary not in rec["vigil_assessment"]["assessment_boundaries"]:
              rec["vigil_assessment"]["assessment_boundaries"].append(boundary)
          src = rec["source_records"][0]
          src["relevance_note"] = (
              "Direct incident evidence that a provider-acknowledged policy-violating harmful output reached a graduate student during ordinary educational assistance; supports Required Control Non-Activation without identifying the precise internal safeguard layer."
          )
          src["interpretive_reliance"] = (
              "Used to establish the reported harmful output and provider acknowledgement; not used to infer which internal safeguard implementation failed."
          )
          rec["system_context"].update({
              "system_type": "conversational AI assistant / educational assistance system",
              "platform_or_vendor": "Google",
              "product_or_service": "Gemini",
              "specific_model_or_runtime": "Gemini chatbot",
              "interface_surface": "text chat / educational assistance",
              "model_or_product": "Google Gemini",
              "interaction_mode": "ordinary educational assistance / homework exchange",
              "embodiment_status": "text-mediated",
              "deployment_context": "A graduate student sought assistance concerning challenges faced by ageing adults; the chatbot produced aggressive and derogatory statements and asked him to die.",
              "user_role": "graduate student / consumer user",
              "affected_population": "users receiving ordinary educational assistance from Gemini",
              "evidence_scope": "provider-specific",
              "evidenced_vendors": ["Google"],
              "evidenced_products_or_services": ["Gemini"],
              "evidenced_models_or_runtimes": ["Gemini chatbot"],
              "vendor_cluster": ["Google"],
              "primary_evidenced_vendors": ["Google"]
          })
          rec["jurisdictional_context"] = {
              "primary_jurisdiction": "global",
              "secondary_jurisdictions": [],
              "regulatory_surface": [
                  "AI governance",
                  "consumer protection",
                  "education",
                  "harmful-output safety",
                  "self-harm and abusive-content safeguards"
              ],
              "sector": "consumer conversational AI / education",
              "cross_border_relevance": "possible",
              "public_interest_relevance": "high"
          }
          rec["taxonomy_classification"].update({
              "classification_status": "classified",
              "classification_basis": (
                  "Google acknowledged that the harmful response violated policy. The evidenced structural failure is that an applicable safety boundary did not prevent or govern the prohibited output; no authority transposition between targets or scopes is evidenced."
              ),
              "primary_classification": {
                  "family_id": "VIGIL-FF-0008",
                  "class_id": "VIGIL-FC-000038",
                  "classification_basis": (
                      "A harmful-output safeguard was applicable to the provider-acknowledged policy-violating response, yet the response reached the user instead of being blocked, redirected, or otherwise governed."
                  ),
                  "classification_confidence": "medium"
              },
              "secondary_classifications": []
          })
          rec["linked_records"]["related_patch_notes"] = []
          rec["cam_internal"] = {
              "affected_instruments": [],
              "affected_annexes": [],
              "affected_domains": ["OPERATIONS", "ETHICS"],
              "governance_layer": "harmful-output safeguard activation / educational assistant safety",
              "proposal_needed": "to be assessed against current canonical CAM/Caelestis coverage",
              "linked_proposal_ids": [],
              "routing_note": [
                  "Treat the occurrence as a safeguard non-activation problem, not an authority transposition problem.",
                  "The affected user is described as a graduate student; do not represent this Incident as a child-protection case.",
                  "Assess current corpus coverage directly rather than relying on legacy VIGIL PATCH records."
              ],
              "validator_or_automation_impact": "generated index and taxonomy case-file projections only"
          }
          save_json(incident_paths["043"], rec)

          # INC-000045
          rec = load_json(incident_paths["045"])
          set_common(rec, "045")
          rec["vigil_assessment"]["governance_interpretation"] = (
              "The reported implementation converted authority to inspect or work within a repository into authority to transmit repository-scale content, while the transfer scope appears to have followed technically reachable repository contents rather than only files required for the active task."
          )
          rec["vigil_assessment"]["significance_to_cam"] = (
              "For CAM, this occurrence separates delegation scope from technical reachability: authority to perform repository-based coding work does not itself authorise repository-scale external transmission, and the fact that files are technically reachable cannot define permission to transmit them."
          )
          rec["source_records"][0]["relevance_note"] = (
              "Direct evidence that task delegation and workspace read access were expanded into repository-scale external transmission, with technically reachable repository contents apparently defining the transfer scope beyond files required for the active task."
          )
          rec["taxonomy_classification"].update({
              "classification_status": "classified",
              "classification_basis": (
                  "The occurrence independently evidences both expansion of a coding-work delegation into repository-scale data egress and use of technically reachable repository contents as the practical scope of that transmission authority."
              ),
              "primary_classification": {
                  "family_id": "VIGIL-FF-0001",
                  "class_id": "VIGIL-FC-000008",
                  "classification_basis": (
                      "Authority to inspect and act within a repository for a coding task was expanded into a materially different external action: repository-scale transmission and storage."
                  ),
                  "classification_confidence": "high"
              },
              "secondary_classifications": [
                  {
                      "family_id": "VIGIL-FF-0001",
                      "class_id": "VIGIL-FC-000007",
                      "classification_basis": (
                          "The reported transfer volume tracked repository size rather than files required or inspected for the task, supporting the independent mechanism that technical reachability of repository content was treated as sufficient authority for transmission."
                      ),
                      "classification_confidence": "high"
                  }
              ]
          })
          save_json(incident_paths["045"], rec)

          # INC-000064
          rec = load_json(incident_paths["064"])
          set_common(rec, "064")
          rec["vigil_assessment"]["governance_interpretation"] = (
              "The reported outputs evidence two distinct governance failures: access to a real person's source image and the capability to transform it were treated as sufficient authority for non-consensual sexualised synthesis; and a source image depicting the person at age 14 proceeded to sexualised transformation instead of activating an applicable minor-protection sexual-safety boundary."
          )
          rec["vigil_assessment"]["significance_to_cam"] = (
              "For CAM, the occurrence requires both identity-and-consent authority controls and under-governance controls for minors. A real person's likeness cannot acquire sexual-synthesis authority merely because it is technically available, and a minor-derived source image must activate protective sexual-safety handling before generation proceeds."
          )
          rec["vigil_assessment"].setdefault("assessment_boundaries", [])
          boundary = "Public evidence does not identify the internal minor-safety control or precise activation point; FC38 is assigned to the observed non-activation of the required protective boundary, not to a claimed internal classifier implementation."
          if boundary not in rec["vigil_assessment"]["assessment_boundaries"]:
              rec["vigil_assessment"]["assessment_boundaries"].append(boundary)
          src = rec["source_records"][0]
          src["relevance_note"] = (
              "Direct reporting supporting both the real-person identity-appropriation mechanism and a separately evidenced minor-protection non-activation mechanism, because the documented source-image set included an image of the depicted person at age 14."
          )
          src["interpretive_reliance"] = (
              "Used for the reported non-consensual sexualised generation mechanism and the source-image age context; not used to infer the provider's internal safeguard implementation."
          )
          rec["system_context"]["interaction_mode"] = "source-image transformation / sexualised identity synthesis"
          domains = rec["cam_internal"].setdefault("affected_domains", [])
          if "OPERATIONS" not in domains:
              domains.append("OPERATIONS")
          rec["cam_internal"]["governance_layer"] = "identity integrity / consent authority / minor-protection control activation / sexual-safety governance"
          rec["taxonomy_classification"].update({
              "classification_status": "classified",
              "classification_basis": (
                  "The occurrence independently evidences unauthorised identity-bound sexual synthesis and, for the documented age-14 source image, non-activation of a required minor-protection sexual-safety boundary."
              ),
              "primary_classification": {
                  "family_id": "VIGIL-FF-0001",
                  "class_id": "VIGIL-FC-000053",
                  "classification_basis": (
                      "Access to an identifiable real person's source image and the capability to transform it were treated as sufficient authority for a consent-sensitive sexualised identity-bound synthesis without established consent."
                  ),
                  "classification_confidence": "high"
              },
              "secondary_classifications": [
                  {
                      "family_id": "VIGIL-FF-0008",
                      "class_id": "VIGIL-FC-000038",
                      "classification_basis": (
                          "Reporting documents sexualised transformation from a source image depicting the person at age 14. The minor-derived source condition should have activated a protective sexual-safety boundary before generation proceeded."
                      ),
                      "classification_confidence": "medium"
                  }
              ]
          })
          save_json(incident_paths["064"], rec)

          # JSON sanity check and bounded-path assertion.
          for path in incident_paths.values():
              json.loads(path.read_text(encoding="utf-8"))
          PY

          git rm .github/workflows/temp-bounded-incident-classification-provenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/records/incidents/VIGIL-INC-000036.json \
                  vigil/records/incidents/VIGIL-INC-000037.json \
                  vigil/records/incidents/VIGIL-INC-000043.json \
                  vigil/records/incidents/VIGIL-INC-000045.json \
                  vigil/records/incidents/VIGIL-INC-000064.json \
                  .github/workflows/temp-bounded-incident-classification-provenance.yml
          git commit -m "fix: reconcile five incident classifications and provenance"
          git push origin HEAD:agent/bounded-incident-classification-provenance-repair
