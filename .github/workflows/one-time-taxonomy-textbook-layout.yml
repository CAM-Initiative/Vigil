name: One-time taxonomy textbook layout

on:
  push:
    branches:
      - agent/hugging-face-authority-reconciliation
    paths:
      - ".github/workflows/one-time-taxonomy-textbook-layout.yml"

permissions:
  contents: write

jobs:
  rebuild-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hugging-face-authority-reconciliation
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Rebuild canonical textbook publication
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify evidence-source date and publication output
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy

          module = runpy.run_path('vigil/taxonomy/render_taxonomy.py')
          context = module['case_study_context']({'failure_mode_id': 'VIGIL-2026-FM-0071'})
          if context.get('date') != '5 February 2026':
              raise SystemExit(f"Unexpected FM-0071 publication date: {context!r}")

          pdf = Path('vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf')
          if not pdf.exists() or not pdf.read_bytes().startswith(b'%PDF-'):
              raise SystemExit('Canonical textbook PDF is invalid')
          print(f"FM-0071 publication date: {context['date']}")
          print(f"PDF: {pdf.stat().st_size:,} bytes")
          PY

      - name: Commit regenerated publication outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/taxonomy/generated/*.html
          git add vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if git diff --cached --quiet; then
            echo "Generated taxonomy publication is already current."
          else
            git commit -m "Rebuild taxonomy textbook with evidence publication dates"
            git push
          fi
