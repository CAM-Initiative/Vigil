name: Temporary refresh Incident migration outputs

on:
  push:
    branches:
      - agent/bounded-incident-classification-provenance-repair
    paths:
      - ".github/workflows/temporary-refresh-incident-migration-outputs.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bounded-incident-classification-provenance-repair
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Refresh deterministic migration outputs
        run: |
          python vigil/scripts/build-incident-migration-decisions.py
          python vigil/scripts/build-incident-migration-crosswalk.py
          python vigil/scripts/validate-incident-migration.py
      - name: Commit deterministic migration outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/migrations/incident-registry/Incident.Migration.Decisions.json vigil/migrations/incident-registry/VIGIL.FM-OBS-to-INC.Crosswalk.json
          git commit -m "chore: refresh Incident migration reconciliation outputs"
          git push origin HEAD:agent/bounded-incident-classification-provenance-repair
