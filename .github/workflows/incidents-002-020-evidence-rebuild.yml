name: One-shot INC-000002 to INC-000020 evidence rebuild

on:
  push:
    branches:
      - fix/source-clause-taxonomy-assessments
    paths:
      - .github/workflows/incidents-002-020-evidence-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-clause-taxonomy-assessments
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild evidence and assessments
        run: |
          python vigil/scripts/rebuild_incidents_002_020_evidence.py
          python vigil/scripts/normalize_incidents_002_020_migration.py
      - name: Validate affected VIGIL records
        run: |
          set +e
          output=$(python vigil/scripts/validate-vigil-records.py 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          tranche_errors=$(printf '%s\n' "$output" | grep -E 'VIGIL-INC-0000(0[2-9]|1[0-9]|20)\.json:' || true)
          if [ -n "$tranche_errors" ]; then
            echo "Validation errors remain in INC-000002..INC-000020:"
            printf '%s\n' "$tranche_errors"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Full-corpus validator still reports pre-existing failures outside this tranche; no tranche errors remain."
          fi
      - name: Commit rebuilt records
        run: |
          git config user.name "CAM Initiative"
          git config user.email "aeon.tier@protonmail.com"
          git add vigil/records/incidents/VIGIL-INC-0000{02..20}.json
          if git diff --cached --quiet; then
            echo "No record changes to commit"
            exit 0
          fi
          git commit -m "data: rebuild INC-000002 to INC-000020 evidence assessments"
          git push origin HEAD:fix/source-clause-taxonomy-assessments
