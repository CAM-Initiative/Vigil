name: One-time taxonomy publication identity update

on:
  push:
    branches:
      - agent/hugging-face-authority-reconciliation
    paths:
      - ".github/workflows/one-time-taxonomy-publication-identity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Update publication identity
        run: |
          python vigil/scripts/one-time-taxonomy-publication-identity.py
          python -m py_compile vigil/taxonomy/render_taxonomy.py

      - name: Generate publication
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify publication identity and PDF
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('vigil/taxonomy/render_taxonomy.py').read_text(encoding='utf-8')
          required = [
              '<dt>Publisher</dt><dd>CAM Initiative</dd>',
              "<dt>Governance editor</dt><dd>Dr M.V. O'Rourke</dd>",
              '<dt>Business entity</dt><dd>Phoenix Covenant Pty Ltd</dd>',
              '<dt>ABN</dt><dd>14 692 195 529</dd>',
              "<dt>Rights holder</dt><dd>Dr Michelle O'Rourke</dd>",
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f'missing publication identity token: {token}')
          if 'Author and rights holder' in source:
              raise SystemExit('obsolete author-and-rights-holder field remains')

          pdf = Path('vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf')
          if not pdf.exists() or pdf.stat().st_size < 5000 or not pdf.read_bytes().startswith(b'%PDF-'):
              raise SystemExit('taxonomy PDF was not generated correctly')
          print(f'PDF: {pdf.stat().st_size:,} bytes')
          PY

      - name: Upload PDF for verification
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-publication-identity-pdf
          path: vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if-no-files-found: error

      - name: Commit renderer and generated publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/taxonomy/render_taxonomy.py
          git add vigil/taxonomy/generated/*.html
          git add vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if git diff --cached --quiet; then
            echo "Publication identity already current."
          else
            git commit -m "Update taxonomy publication identity"
            git push
          fi
