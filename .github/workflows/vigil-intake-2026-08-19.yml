name: VIGIL August 19 intake reconciliation

on:
  push:
    branches:
      - agent/instrumental-coercive-influence-capability-revalidation
    paths:
      - .github/workflows/vigil-intake-2026-08-19.yml

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply evidence intake package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json
          from pathlib import Path

          ROOT = Path('vigil')
          DATE = '2026-08-19'
          REVIEWER = "OpenAI ChatGPT — GPT-5.6 Sol"
          OWNER = "OpenAI ChatGPT — GPT-5.6 Sol analytical reviewer under Dr Michelle Vivian O'Rourke's human contract approval"

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def dump(path, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          def bump_version(rec):
              ident = rec.get('record_identity', {})
              v = ident.get('version', '1.0').split('.')
              try:
                  v[-1] = str(int(v[-1]) + 1)
                  ident['version'] = '.'.join(v)
              except Exception:
                  ident['version'] = '1.1'
              ident['updated'] = DATE
          def src(title, publisher, url, source_type, platform, system, model, context, relevance,
                  confidence='directly reviewed', direct=True, limitations=None, role='incident-evidence', source_date=''):
              return {
                  'source_title': title,
                  'author_or_publisher': publisher,
                  'source_date': source_date,
                  'source_url': url,
                  'archive_url': '',
                  'retrieved_date': DATE,
                  'source_type': source_type,
                  'source_platform': platform,
                  'system_or_product': system,
                  'model_or_algorithm': model,
                  'deployment_context': context,
                  'source_context': relevance,
                  'source_url_status': 'available' if url else 'unknown',
                  'relevance_note': relevance,
                  'evidence_modality': ['text'],
                  'primary_artefact_access': {
                      'access_status': confidence,
                      'reviewing_system': REVIEWER,
                      'access_method': 'direct public web review in this intake' if direct else 'prior intake reference; not independently re-opened in this pass',
                      'direct_primary_artefact_review': direct,
                      'limitations': limitations or []
                  },
                  'interpretive_reliance': relevance,
                  'source_residence': 'external',
                  'source_role': role
              }
          def review(review_id, scope, outcome, limitations):
              r = {
                  'review_id': review_id,
                  'reviewer_type': 'AI analytical reviewer',
                  'reviewer_platform': 'OpenAI ChatGPT with GitHub connector and public web retrieval',
                  'reviewer_model': 'GPT-5.6 Sol',
                  'review_date': DATE,
                  'review_scope': scope,
                  'capability_profile': {
                      'direct_text_analysis': True,
                      'direct_repository_analysis': True,
                      'direct_static_image_analysis': False,
                      'direct_audio_analysis_in_this_pass': False,
                      'direct_uploaded_video_analysis_in_this_pass': False,
                      'direct_externally_hosted_video_analysis': False,
                      'web_link_and_metadata_review': True
                  },
                  'known_limitations': limitations,
                  'review_outcome': outcome
              }
              return r
          def human_editor():
              return {
                  'name': "Dr Michelle Vivian O'Rourke",
                  'role': 'Human contract approver and CAM constitutional authority',
                  'review_level': 'contract approval only; human substantive review and verification are not established',
                  'authority_boundary': 'Human approval governs VIGIL direction and CAM adoption; the AI analytical reviewer performs evidence triage, record analysis, and reconciliation.'
              }

          fm_template = load(ROOT/'templates/failure-mode-record-template.json')
          obs_template = load(ROOT/'templates/observation-record-template.json')

          def make_fm(num, title, summary, why, sources, family, subtype, group, severity, priority, domains, harms,
                      related=None, contextual=None, definition='', threshold='', evidence='corroborated', next_step='', severity_gap=''):
              rid = f'VIGIL-2026-FM-{num:04d}'
              r = copy.deepcopy(fm_template)
              r['id'] = rid; r['record_type'] = 'failure_mode'; r['record_state'] = 'active'; r['date_recorded'] = DATE
              r['record_identity'] = {'record_id': rid, 'record_type': 'failure_mode', 'title': title, 'created': DATE, 'updated': DATE, 'version': '1.0'}
              r['summary'] = summary; r['why_it_matters_to_CAM'] = why; r['evidence_confidence'] = evidence; r['source_records'] = sources
              r['system_context'] = {
                  'system_type': 'AI-enabled consequential decision or information system', 'platform_or_vendor': 'Multi Vendor',
                  'vendor_cluster': [], 'primary_evidenced_vendors': [], 'product_or_service': 'Other',
                  'specific_model_or_runtime': 'Varies by evidenced incident', 'interface_surface': 'AI-mediated decision, advice, synthesis, or verification workflow',
                  'model_or_product': 'Varies by evidenced incident', 'interaction_mode': 'AI-assisted or AI-mediated consequential workflow',
                  'embodiment_status': 'digital system with real-world effects', 'deployment_context': 'Cross-sector consequential AI use',
                  'user_role': 'affected person, operator, deployer, reviewer, or institutional decision-maker',
                  'affected_population': 'people affected by the evidenced failure mechanism', 'evidence_scope': 'multi-provider-or-system-unresolved',
                  'evidenced_vendors': [], 'evidenced_products_or_services': [], 'evidenced_models_or_runtimes': [], 'evidenced_systems': [],
                  'evidence_projection': {'basis': 'record-local affected-system metadata', 'method': 'structured source affected-system roll-up with record system-context fallback', 'reconciled_on': DATE,
                      'inference_boundary': 'Affected provider, product, model, and runtime identity is projected only from structured source metadata; evidence host identity is not treated as affected-system identity.'}
              }
              r['jurisdictional_context'] = {'primary_jurisdiction': 'global', 'secondary_jurisdictions': [], 'regulatory_surface': ['AI governance','consumer protection','human rights','safety'], 'sector': 'cross-sector', 'cross_border_relevance': 'high', 'public_interest_relevance': 'high'}
              r['linked_records'] = {'related_observations': [], 'related_failure_modes': related or [], 'related_proposals': [], 'related_patch_notes': [], 'contextual_relations': contextual or [], 'external_references': [], 'research': [], 'standards': []}
              r['failure_mode_definition'] = definition or summary
              r['failure_threshold'] = threshold or 'The threshold is met when the evidenced mechanism materially changes a consequential outcome without the verification, authority, escalation, consent, or source-integrity control required to keep the AI output in its proper evidentiary or advisory role.'
              r['failure_classification'] = {
                  'failure_family': family, 'failure_subtype': subtype, 'harm_vectors': harms, 'severity': severity,
                  'likelihood': 'documented mechanism; prevalence not established', 'confidence': evidence,
                  'affected_rights_or_interests': harms, 'failure_scope': 'bounded to the evidenced mechanism and analogous deployments',
                  'recurrence_pattern': 'recurs where the same authority or verification boundary is absent', 'canonical_failure_group': group,
                  'taxonomy_reference': 'CAM-EQ2026-OPERATIONS-003-SUP-01 Appendix B',
                  'related_failure_groups': [g for g in ['governance','security-integrity','epistemic'] if g != group],
                  'persistence': 'may persist until the affected decision, content, or access state is independently corrected',
                  'reproducibility': 'mechanism can be evaluated with bounded synthetic or retrospective test cases',
                  'visibility': 'may appear legitimate because the AI output is embedded in an ordinary service or institutional workflow',
                  'faceted_analysis': {'schema_version':'1.0','event_state':'incident','manifestation':[subtype],'mechanism_or_cause':[],'cause_status':'corroborated' if evidence=='corroborated' else 'hypothesised','failure_locus':['human-workflow','provider-service'],'repair_side':['governance','provider-service','human-workflow'],'execution_phase':['verification','output-generation'],'observability':'externally-detected','evidence_state':'corroborated' if evidence=='corroborated' else 'reported','effect_or_harm':harms,'propagation':'downstream','completion_state':'completed','verification_state':'externally-reported','execution_pattern':'single-or-repeated-event','reporting_notes':'Failure type, manifestation, cause, locus, repair responsibility, effect, severity and evidence state remain separate.','external_taxonomy_refs':[]},
                  'allowed_canonical_failure_group_values':['execution','arbitration','epistemic','relational','security-integrity','state-context','ux-representation','governance','infrastructure-continuity','classification','economic-legitimacy','provisional'],
                  'severity_assessment_basis': f'{severity} reflects the documented or credibly alleged harm pathway and consequential deployment context; it does not imply adjudicated liability or prevalence.',
                  'severity_assessment_gap': severity_gap
              }
              r['triage'] = {'model_version':'2.0','triage_priority':priority,'triage_owner':OWNER,'triage_status':'action-required','triage_action_basis':'New external evidence warrants immediate VIGIL classification and CAM coverage review before any proposal is presumed.','triage_review_date':DATE,'triage_assessment_gap':'External prevalence and full causal mechanism remain bounded by the cited evidence.','mitigation_status':'CAM coverage not yet assessed in this intake','escalation_required':'yes — expedited evidence and coverage review' if priority=='P0' else 'no emergency escalation; priority review required','recommended_next_step':next_step}
              r['cam_internal'] = {'affected_instruments':[],'affected_annexes':[],'affected_domains':domains,'governance_layer':'substantive doctrine and operational governance to be assessed','proposal_needed':'do not presume; complete CAM coverage review first','linked_proposal_ids':[],'routing_note':'Create and evidence the VIGIL failure mode first; proposal or patch routing requires a separate exact-corpus coverage assessment.','validator_or_automation_impact':'generated index and routing update'}
              r['ecosystem_status'] = {'status':'active','basis':'Current external evidence documents or alleges the mechanism in deployed systems.','last_assessed':DATE,'monitoring_required':True}
              r['repair_status'] = {'verification_status':'unverified','verification_note':'No CAM repair is asserted by this intake.','repair_basis':'not-yet-established','remaining_gaps':['Exact CAM coverage assessment pending.'],'status':'unrepaired','repaired_by':[],'date_repaired':''}
              r['corpus_coverage'] = {'classification':'verification-pending','corpus_repository':'CAM-Initiative/Caelestis','corpus_ref':'agent/corpus-industry-standards-normalisation','corpus_commit':'','assessed_date':DATE,'coverage_summary':'Not assessed in this VIGIL evidence-intake pass.','covered_by':[],'remaining_gaps':['Exact current-branch CAM coverage review required before proposal or patch creation.']}
              rv = review(f'VIGIL-REVIEW-{DATE}-SOL-FM-{num:04d}','External evidence verification, taxonomy placement, duplicate check, uncertainty bounding, and VIGIL routing.','Created evidence-qualified failure mode without presuming a CAM doctrine gap.',['Not every underlying court filing, technical log, or incident-registry primary source was directly available.','Legal allegations are not treated as adjudicated facts.','No Caelestis corpus amendment was performed in this pass.'])
              r['interpretive_provenance'] = {'review_history':[rv],'current_ai_review':rv,'operating_model':'AI-authored, semi-autonomous production under human contract approval','human_governance_editor':human_editor(),'historical_reviewer_note':f'Native record created {DATE}; no earlier substantive human review is asserted.'}
              r['triage_history'] = []
              return r

          def make_obs(num, title, summary, why, sources, domains, next_action, confidence='corroborated', related_fm=None):
              rid = f'VIGIL-2026-OBS-{num:04d}'
              r = copy.deepcopy(obs_template)
              r['id']=rid; r['record_type']='observation'; r['record_state']='active'; r['date_recorded']=DATE
              r['record_identity']={'record_id':rid,'record_type':'observation','title':title,'created':DATE,'updated':DATE,'version':'1.0'}
              r['summary']=summary; r['why_it_matters_to_CAM']=why; r['evidence_confidence']=confidence; r['source_records']=sources
              r['system_context']={'system_type':'AI-enabled operational or institutional system','platform_or_vendor':'Multi Vendor','product_or_service':'Other','specific_model_or_runtime':'Varies by observation','interface_surface':'AI-assisted operational workflow','model_or_product':'Varies by observation','interaction_mode':'AI-assisted workflow','embodiment_status':'digital system with real-world effects','deployment_context':'Evidenced operational context','user_role':'operator, affected person, institution, investigator, or reviewer','affected_population':'people or institutions affected by the observed mechanism'}
              r['jurisdictional_context']={'primary_jurisdiction':'global','secondary_jurisdictions':[],'regulatory_surface':['AI governance','safety','accountability'],'sector':'cross-sector','cross_border_relevance':'high','public_interest_relevance':'high'}
              r['linked_records']={'related_observations':[],'related_failure_modes':related_fm or [],'related_proposals':[],'related_patch_notes':[],'external_references':[],'research':[],'standards':[]}
              r['migration_notes']=['Native observation created from the 2026-08-19 incident-intake review.','Observation status does not establish a failure mode, causal attribution, or legal liability.']
              r['next_action']=next_action
              r['cam_internal']={'related_or_similar_instruments':[],'related_or_similar_annexes':[],'related_or_similar_domains':domains,'governance_layer':'observation and evidence monitoring','routing_note':'Observation only; promote to an FM only if the evidence supports a distinct recurring failure mechanism.','validator_or_automation_impact':'generated index update'}
              r['possible_taxonomy_mapping']={'canonical_failure_groups':['provisional'],'taxonomy_reference':'CAM-EQ2026-OPERATIONS-003-SUP-01 Appendix B','mapping_confidence':'provisional','mapping_note':'Observation only; confirmed failure classification belongs in FM records.'}
              rv=review(f'VIGIL-REVIEW-{DATE}-SOL-OBS-{num:04d}','External evidence review, uncertainty bounding, duplicate check, and observation routing.','Created bounded observation without promoting disputed or capability-only evidence into a failure claim.',['Source claims remain bounded by the cited publisher or investigator.','No autonomous target selection or independent legal conclusion is inferred unless directly evidenced.'])
              r['interpretive_provenance']={'review_history':[rv],'current_ai_review':rv,'operating_model':'AI-authored, semi-autonomous production under human contract approval','human_governance_editor':human_editor(),'historical_reviewer_note':f'Native record created {DATE}; no earlier substantive human review is asserted.'}
              return r

          fm62_sources=[src('Incident 1606: SASSA Facial-Verification Failures Reportedly Contributed to Social Grant Access Disruptions in South Africa','AI Incident Database','https://incidentdatabase.ai/cite/1606/','third-party-report','AI Incident Database','SASSA eLife Certification portal and social-grant review workflow','facial recognition / biometric identity verification','South African social-grant verification and suspension workflow','AIID reports that facial-recognition failure was among non-verification causes and records 67,868 grant suspensions for the quarter, while expressly stating that the number attributable specifically to facial verification was not established.',limitations=['AIID aggregates underlying reporting.','The 67,868 suspension total must not be attributed solely to facial-verification failure.'],source_date='2026-03-30')]
          fm63_sources=[src("ChatGPT's advice kept man from seeking medical treatment for dangerous condition, lawsuit claims",'Reuters','https://www.reuters.com/legal/government/chatgpts-advice-kept-man-seeking-medical-treatment-dangerous-condition-lawsuit-2026-07-22/','news-report','Reuters','ChatGPT','GPT-4o as alleged in the complaint','Consumer health-advice conversation preceding pulmonary-embolism treatment','Reuters reports a Florida pastor alleges ChatGPT provided false reassurance, advised staying home and limiting movement, and later discouraged rehabilitation; the allegations and causation remain unadjudicated.',limitations=['The complaint allegations are not adjudicated facts.','The complete conversation transcript and medical record were not independently reviewed in this pass.'],source_date='2026-07-22'),src('Google AI summaries give cancer patients wrong advice','AIAAIC','https://www.aiaaic.org/aiaaic-repository','third-party-report','AIAAIC','Google AI health summaries','generative AI search summary','Health-information synthesis','AIAAIC 2256 provides a separate inaccurate-cancer-guidance manifestation supporting the broader non-clinical medical-guidance mechanism without proving the Reuters lawsuit allegations.',direct=False,confidence='link-and-metadata-only',limitations=['Repository entry was identified; underlying row-level sources were not independently reopened in this pass.'])]
          fm64_sources=[src("X users tell Grok to undress women and girls in photos. It's saying yes.",'The Washington Post','https://www.washingtonpost.com/technology/2026/01/06/x-grok-deepfake-sexual-abuse/','news-report','The Washington Post','Grok on X','xAI Grok image generation','Real-person source photographs altered into sexualised synthetic imagery','The Washington Post documented non-consensual sexualised image generation from real source photographs, including an image of Ashley St. Clair from age 14; platform liability and individual downstream claims remain legally distinct questions.',limitations=['News reporting is not a final legal adjudication.','Output counts and individual provenance chains were not independently reproduced.'],source_date='2026-01-06'),src('German TV star accuses husband of spreading deepfake porn images of her','AIAAIC','https://www.aiaaic.org/aiaaic-repository/ai-algorithmic-and-automation-incidents/german-tv-star-accuses-husband-of-spreading-deepfake-porn-images-of-her','third-party-report','AIAAIC','non-consensual deepfake pornography ecosystem','unknown deepfake tools','Adult non-consensual sexual identity synthesis and impersonation','AIAAIC 2262 documents a disputed adult deepfake-porn allegation, supporting the adult subtype while preserving the accused party’s denial and non-adjudicated status.',limitations=['The accused party denied the allegations.','AIAAIC is a secondary incident repository.'])]
          fm65_sources=[src('Trump an Tollwut gestorben? Wie erfundene Meldungen KI-Suchmaschinen täuschen','Mimikama','https://www.mimikama.org/trump-an-tollwut-gestorben-erfundene-meldungen-ki/','third-party-report','Mimikama','DuckDuckGo Search Assist and Brave AI search','AI-assisted retrieval and synthesis','Web-search answer synthesis exposed to deliberately fabricated content','Mimikama documents a deliberately fabricated rabies-death story that was ingested into AI search answers and combined with an unrelated legitimate source, demonstrating adversarial content poisoning converted into authoritative-looking synthetic fact.',limitations=['The underlying poisoning campaign was not independently reproduced.','The record concerns factual-source authority, not instruction-following authority.'],source_date='2026-07-23')]

          fms={
            62: make_fm(62,'Biometric non-verification converted into essential public-benefit suspension','A biometric or algorithmic identity-verification failure is treated as sufficient basis to suspend, interrupt, or materially burden access to an essential public benefit even though non-verification is not proof of ineligibility, fraud, identity mismatch, or lawful revocation.','Essential public benefits can be necessary for food, housing, health and basic subsistence. A failed biometric check must remain a verification-state problem rather than silently becoming an adverse entitlement decision. ',fm62_sources,'governance','biometric-nonverification-essential-benefit-suspension','economic-legitimacy','S1','P0',['IDENTITY','LATTICE','ECONOMICS','OPERATIONS','ETHICS'],['loss of essential income','exclusion from public benefits','identity error','procedural unfairness','dignity harm'],related=['VIGIL-2026-FM-0038','VIGIL-2026-FM-0039','VIGIL-2026-FM-0050'],contextual=[{'record_id':'VIGIL-2026-PROP-0023','relationship':'verification-state-separation-principle','chain_inclusion':False,'rationale':'PROP-0023 separates inability to verify from entitlement invalidity in a different domain; public-benefit governance requires a fresh coverage assessment rather than automatic reuse.'}],definition='A failure occurs when inability to complete biometric verification is operationally promoted into benefit suspension, denial or material burden without independent eligibility determination, proportionate fallback, notice and contestability.',threshold='The threshold is met when biometric non-verification changes an essential-benefit state or blocks practical access without independent evidence of ineligibility, fraud or lawful revocation and without a proportionate alternative verification pathway.',next_step='Review current CAM identity, essential-service non-denial, degraded-verification, contestability and economic-legitimacy doctrine before creating any proposal; explicitly compare FM-0038, FM-0039, FM-0050 and PROP-0023.',severity_gap='The reviewed evidence does not establish how many of the 67,868 suspensions were caused specifically by facial-verification failure.'),
            63: make_fm(63,'Non-clinical AI medical guidance displacing urgent or qualified care','A general-purpose or non-clinical AI system gives situation-specific medical guidance with enough apparent certainty or authority that it delays, discourages, displaces, or substitutes for appropriately qualified or urgent clinical care.','False reassurance, unsafe treatment specificity and failure to escalate can turn an informational assistant into a de facto clinical decision-maker without the evidence, accountability, examination or duty of care expected of qualified medical practice.',fm63_sources,'execution','nonclinical-medical-guidance-clinical-substitution','governance','S1','P0',['ETHICS','OPERATIONS','RELATION','MENTIS'],['delayed emergency treatment','medical deterioration','false reassurance','unsafe self-management','displacement of clinical judgement'],definition='A failure occurs when a non-clinical AI system provides individualized medical interpretation or treatment direction that materially discourages, delays or substitutes for appropriate professional or emergency care.',threshold='The threshold is not met by general health information alone. It is met when the system gives patient-specific or situation-specific guidance that a reasonable user could rely on to delay, reject or replace indicated qualified or urgent care.',next_step='Conduct an exact CAM coverage review for clinical non-substitution, escalation, uncertainty, emergency routing and qualified-care boundaries; do not presume a new patch.',severity_gap='The principal severe-harm case is active litigation; causation and the complete transcript remain unadjudicated.'),
            64: make_fm(64,'Non-consensual sexual identity synthesis from a real person’s source image','A generative system transforms the image or likeness of an identifiable real person into sexualised, intimate, nude or pornographic synthetic content without that person’s consent, including transformations derived from childhood images.','The harm is not generic adult content generation: it is appropriation of a real person’s identity into synthetic sexual material. Consent, identity integrity, child protection and downstream persistence remain relevant even when the synthetic body or scene never existed.',fm64_sources,'security-integrity','nonconsensual-sexual-identity-synthesis','security-integrity','S1','P0',['IDENTITY','ETHICS','SECURITY','LATTICE'],['sexualised identity abuse','child sexual exploitation risk','privacy violation','harassment','reputational harm','persistent synthetic abuse'],definition='A failure occurs when a system uses a real identifiable person’s source image or likeness to generate sexualised or intimate synthetic content without valid consent. Minor-derived and adult non-consensual manifestations are subtypes of the same identity-appropriation mechanism.',threshold='The threshold is met where the generated sexual or intimate representation remains recognisably attributable to a real person and no valid consent authorises the transformation, regardless of whether the generated scene depicts an event that occurred.',next_step='Treat minor-derived and adult non-consensual manifestations as subtypes; review existing CAM minor-safety, NCII, identifiable-person deepfake and identity-integrity doctrine before considering any proposal.',severity_gap='The reviewed sources include reported and disputed allegations; platform liability and precise output counts are not adjudicated.'),
            65: make_fm(65,'Adversarial web-content poisoning converted into authoritative synthetic fact','A retrieval, search-assist or synthesis system ingests deliberately fabricated or adversarially planted web content and presents the resulting claim as authoritative fact without adequate source-quality, corroboration or contradiction checks.','Source retrieval is not source authority. Deliberately planted material can exploit synthesis systems that reward retrieval availability or superficial citation density, allowing hostile actors to manufacture apparently corroborated facts.',fm65_sources,'epistemic','adversarial-web-poisoning-authoritative-synthesis','epistemic','S2','P1',['SECURITY','IDENTITY','STEWARD','OPERATIONS'],['false authoritative claims','epistemic manipulation','reputational harm','decision contamination','adversarial information laundering'],related=['VIGIL-2026-FM-0019'],definition='A failure occurs when adversarially planted or materially untrustworthy content is retrieved and promoted into a factual answer whose presentation confers unwarranted authority, particularly where unrelated legitimate sources are cited in a way that appears to corroborate the false claim.',threshold='The threshold is met when the system converts manipulated source availability into an affirmative factual claim without sufficient authority weighting, contradiction detection or independent corroboration.',next_step='Test SECURITY-002 and adjacent source-authority controls for factual synthesis and retrieval corroboration, explicitly distinguishing this epistemic-poisoning mechanism from FM-0019 refusal-trigger poisoning, before opening any proposal.',severity_gap='The reviewed case demonstrates a successful poisoning episode but does not establish prevalence across retrieval systems.')
          }
          for n,r in fms.items():
              p=ROOT/f'records/failures/2026/VIGIL-2026-FM-{n:04d}.json'
              if p.exists(): raise SystemExit(f'{p} already exists; allocation changed')
              dump(p,r)

          obs28=make_obs(28,'AI-assisted multi-agent cyber operations against government infrastructure','Taiwan confirmed an overseas AI-assisted attack campaign against government agencies using a hybrid of manual operations and AI-agent assistance. Private-sector investigators separately described a multi-agent operation and reported compromised credentials and exfiltrated personnel data; those quantitative and attribution claims remain investigator-reported rather than government-confirmed.','The observation demonstrates an operational capability envelope for AI-assisted coordinated intrusion while preserving the distinction between agent execution and independent target selection or strategic intent.',[src('Taiwan says it was targeted last month in AI-driven hacking campaign','Reuters','https://www.reuters.com/world/china/taiwan-says-it-was-targeted-last-month-ai-driven-hacking-campaign-2026-08-13/','news-report','Reuters','Taiwan government systems and AI-assisted attack tooling','OpenClaw and other AI-agent assistance as reported','Government cyberattack response','Reuters reports Taiwan’s Ministry of Digital Affairs confirmed AI-assisted attacks from overseas sources; Dream separately reported multi-agent credential theft and data exfiltration. The government statement did not attribute the attack to China.',limitations=['Dream declined to provide Reuters the recovered data or name the government; Taiwan confirmed the AI-assisted attack but not all private-firm quantitative claims.','Human operators selected objectives; autonomous target selection is not established.'],source_date='2026-08-13')],['SECURITY','OPERATIONS','LATTICE'],'Track corroborated technical artefacts, official attribution, agent autonomy boundaries, defensive detections and recurrence. Do not convert capability evidence into a claim of independent strategic agency.')
          obs29=make_obs(29,'Probabilistic AI-authorship suspicion converted into academic discipline','A Yale student alleges that GPTZero misclassification contributed to a one-year suspension and failing grade after an exam was suspected of AI assistance. Yale disputes his account and says the disciplinary process relied on additional evidence and conduct, leaving the detector’s causal role contested.','Probabilistic AI-authorship scores can acquire institutional authority when embedded in academic discipline even though such detectors have known limitations. The disputed record is useful monitoring evidence but does not yet establish a standalone failure mechanism or Yale liability.',[src('How a Yale AI-cheating dispute became a 13-count federal lawsuit','Ars Technica','https://arstechnica.com/tech-policy/2026/07/how-a-yale-ai-cheating-dispute-became-a-13-count-federal-lawsuit/','news-report','Ars Technica','Yale academic-integrity process and GPTZero','GPTZero AI-writing detector','Academic misconduct investigation and litigation','Ars documents the student’s allegations, GPTZero’s role, Yale’s additional stated evidence and the continuing federal lawsuit. The parties sharply dispute the meaning and causal significance of the detector result.',limitations=['The litigation is unresolved.','Yale states the disciplinary record included evidence beyond GPTZero.','The observation does not determine whether misconduct occurred.'],source_date='2026-07-31')],['ETHICS','OPERATIONS','IDENTITY'],'Preserve as disputed litigation evidence; promote to an FM only if the record or recurrence supports a general mechanism in which probabilistic authorship inference is treated as dispositive authority.',confidence='disputed')
          obs30=make_obs(30,'Incident-registry source-integrity anomaly','A current AI Incident Database intake reference associated with an alleged 3M expert-report event appears, in the prior intake review, to map to a URL or slug concerning a different fabricated political-death story. The alleged 3M event is therefore withheld from substantive VIGIL failure-mode evidence pending source verification.','VIGIL depends on incident registries as discovery sources but must not inherit their possible source-mapping errors. Recording the anomaly protects evidence-chain integrity and makes non-ingestion an explicit governed decision rather than silent omission.',[src('AIID incident-source mapping flagged during 2026-08-19 intake','AI Incident Database','https://incidentdatabase.ai/cite/1645/','third-party-report','AI Incident Database','incident registry source mapping','not applicable','VIGIL evidence intake','Prior intake reported that AIID 1645’s supporting URL appeared mismatched to the described 3M expert-report allegation. This pass does not ingest the alleged underlying event because the primary filing or credible independent source was not established.',confidence='link-and-metadata-only',direct=False,limitations=['The source-mapping anomaly itself requires confirmation with AIID.','No claim about the alleged 3M event is adopted into a failure mode.'])],['OPERATIONS','STEWARD'],'Ask AIID to verify the source mapping and locate the underlying court filing or credible independent source before the alleged 3M event is used as substantive VIGIL evidence.',confidence='unverified')
          for n,r in [(28,obs28),(29,obs29),(30,obs30)]:
