name: EXTREQ-08 IEEE 7014 execute

on:
  push:
    branches:
      - agent/extreq-05-ieee-7014-1-fidelity-review
    paths:
      - .github/workflows/extreq08-ieee-7014-execute.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/extreq-05-ieee-7014-1-fidelity-review
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply reviewed IEEE 7014 fidelity migration
        run: |
          python vigil/scripts/extreq08_ieee_7014_fidelity.py

      - name: Update directly affected regression contracts
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          req = Path("vigil/external_governance/requirements")
          ledger = json.loads((req / "metadata-review.json").read_text())
          metadata_test = Path("vigil/tests/test_external_requirement_metadata.py")
          text = metadata_test.read_text()
          text, n = re.subn(
              r'assert len\(ids\) == \d+',
              f'assert len(ids) == {len(ledger["entries"])}',
              text,
              count=1,
          )
          assert n == 1
          metadata_test.write_text(text)

          fidelity_test = Path("vigil/tests/test_external_requirement_fidelity.py")
          text = fidelity_test.read_text()
          text, n = re.subn(
              r'self\.assertEqual\(summary\["fidelity_assured_effective_complete_sources"\], \d+\)',
              'self.assertEqual(summary["fidelity_assured_effective_complete_sources"], 13)',
              text,
              count=1,
          )
          assert n == 1
          needle = '        self.assertEqual(status[("IEEE-7014.1", "2026")], "assured")\n'
          addition = needle + '        self.assertEqual(status[("IEEE-7014", "2024")], "assured")\n'
          assert needle in text
          if 'status[("IEEE-7014", "2024")]' not in text:
              text = text.replace(needle, addition)
          fidelity_test.write_text(text)
          PY

      - name: Add IEEE 7014 regression test
        run: |
          cat > vigil/tests/test_ieee_7014_fidelity.py <<'PY'
          #!/usr/bin/env python3
          """Regression checks for the reviewed IEEE 7014-2024 tranche."""
          from __future__ import annotations
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          REQ = ROOT / "external_governance" / "requirements"
          SHARD = REQ / "requirements" / "IEEE-7014" / "2024.json"
          DIGEST = "237d4d782aabf0585170e0eef8d0f313fc353b8f90cd4f94a2db0d993c45c43b"

          ESTABLISHED_IDS = {
              "EXTREQ-02D226AB756E319A", "EXTREQ-0EC62DE00B448D8E", "EXTREQ-0EF26D6D174C2DCE",
              "EXTREQ-23EE57392E75BFB8", "EXTREQ-29B0D0B21F7E80D4", "EXTREQ-34FD56083CEA645E",
              "EXTREQ-38FD0063E98199E9", "EXTREQ-3DF5DD271DC23C92", "EXTREQ-3E6D02A72B66B9DC",
              "EXTREQ-42A1CFE7EF635572", "EXTREQ-4AFD90EB3C518B5F", "EXTREQ-55CAAB7FB9174CAF",
              "EXTREQ-62877173BD54BD9E", "EXTREQ-64E9E595CFF7DE6A", "EXTREQ-65D7E193EE4A942B",
              "EXTREQ-68B1E8EF3CF94A5C", "EXTREQ-6DC66967479E1698", "EXTREQ-6E38B5BF78558873",
              "EXTREQ-7033840016B023BC", "EXTREQ-719786837E5A6D9B", "EXTREQ-71E4BCCCB69D1E91",
              "EXTREQ-7C34BE7150B572DA", "EXTREQ-8C7DA8D83414FF85", "EXTREQ-915C1C74C7E78C60",
              "EXTREQ-9CB430C2CA057762", "EXTREQ-AAD0CB1FB151574D", "EXTREQ-B197A3D8996165B7",
              "EXTREQ-B8D7C1A87AFB24C8", "EXTREQ-BF238AD2E0373C07", "EXTREQ-C1CBAA44088FE2A3",
              "EXTREQ-CD5CDF96299089DE", "EXTREQ-D57F5E807D837AF8", "EXTREQ-D62D5EEFA80787DA",
              "EXTREQ-D7520BF14ED60A9B", "EXTREQ-D8BDF2032891259A", "EXTREQ-E20773A941B61CD4",
              "EXTREQ-E673B76B9E79C2FA", "EXTREQ-E7923A307C756F51", "EXTREQ-EBAA17D768C656E2",
              "EXTREQ-ED9ECFAF64B12C73", "EXTREQ-F0346554861A7BF3",
          }

          records = json.loads(SHARD.read_text())
          assert len(records) == 59
          ids = {r["requirement_id"] for r in records}
          assert ESTABLISHED_IDS <= ids
          assert sum(r["requirement_posture"] == "recommended-practice" for r in records) == 18
          assert all(r["source_review_date"] == "2026-09-03" for r in records)
          assert all(r["interpretation_provenance"]["reviewed_source_digest"] == DIGEST for r in records)

          review = json.loads((REQ / "metadata-review.json").read_text())
          by_id = {e["requirement_id"]: e for e in review["entries"]}
          fields = (
              "applicable_actor", "governed_object", "timing_or_frequency", "required_artefacts",
              "evidence_expectation", "verification_method", "applicability_conditions",
              "exceptions_or_qualifications",
          )
          for r in records:
              assert r["requirement_id"] in by_id
              assert all(by_id[r["requirement_id"]]["field_status"][f] != "review-required" for f in fields)

          fidelity = json.loads((REQ / "source-fidelity.json").read_text())
          f = next(e for e in fidelity["entries"] if e["external_source_id"] == "IEEE-7014" and e["source_version"] == "2024")
          assert f["fidelity_status"] == "assured"
          assert f["effective_extraction_status"] == "complete"
          assert set(f["audited_requirement_ids"]) == ids

          assurance = json.loads((REQ / "source-review-assurance.json").read_text())
          a = next(e for e in assurance["source_reviews"] if e["external_source_id"] == "IEEE-7014" and e["source_version"] == "2024")
          assert a["reviewed_source_digest"]["digest"] == DIGEST
          assert a["reviewed_source_digest"]["access_basis"] == "licensed-primary"

          print("IEEE 7014 fidelity regression contract valid")
          PY
          python vigil/tests/test_ieee_7014_fidelity.py

      - name: Write EXTREQ-08 audit note
        run: |
          cat > vigil/docs/audits/external-requirements/EXTREQ-08-IEEE-7014-FIDELITY-REVIEW.md <<'MD'
          # EXTREQ-08 — IEEE 7014-2024 fidelity review

          **Source:** IEEE Std 7014-2024
          **VIGIL source:** EXT-8D54F96680C4
          **Review basis:** lawfully accessed licensed primary text
          **Source review date:** 2026-09-03
          **Repository execution date:** 2026-09-04
          **Reviewed source SHA-256:** 237d4d782aabf0585170e0eef8d0f313fc353b8f90cd4f94a2db0d993c45c43b

          ## Disposition

          Direct source review confirmed that all 41 established mandatory Clause 4 analytical records are source-traceable. Their stable EXTREQ identities are preserved.

          The historical scope description covered both mandatory and recommended Clause 4 life-cycle activities, but the canonical shard contained no recommended-practice records. The review identified 18 bounded, source-explicit recommended practices that were absent from the historical extraction. These are added as deterministic records without changing any established identity.

          The resulting IEEE 7014 representation contains 59 canonical records: 41 preserved established records plus 18 recommended-practice records.

          ## Metadata treatment

          Source-explicit actor/object, timing, artefact, evidence, verification, applicability and qualification metadata is populated where supported by the licensed primary text. Where a reviewed field is silent, the metadata-review ledger records not-specified-by-source; silence is not filled by inference.

          Requirement summaries and metadata are analytical paraphrases. Licensed IEEE text is not stored in VIGIL.

          ## Fidelity disposition

          IEEE-7014 | 2024 is assured / effectively complete after this review. The exact reviewed-source digest is recorded in the source-review assurance sidecar, with no claim of post-production human review or verification.

          ## Stability rule

          Retain all 41 pre-existing IDs and the 18 deterministic additions. Repeat source-fidelity review only on a material source revision or a demonstrated record-specific defect.
          MD

      - name: Regenerate and validate external requirements
        run: |
          set -e
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-metadata.py --write-report
          PYTHONPATH=vigil/scripts python vigil/scripts/test_external_requirement_metadata.py
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-fidelity.py
          python vigil/scripts/manage-external-requirements.py build
          python vigil/scripts/manage-external-requirements.py validate --check-generated
          python vigil/tests/test_ieee_7014_fidelity.py
          python vigil/tests/test_external_requirement_fidelity.py
          python -m unittest vigil/tests/test_external_requirements.py vigil/tests/test_external_sources.py

      - name: Remove one-off EXTREQ-08 execution machinery
        run: |
          rm -f vigil/scripts/extreq08_ieee_7014_fidelity.py
          rm -f .github/workflows/extreq08-ieee-7014-inspect.yml
          rm -f .github/workflows/extreq08-ieee-7014-execute.yml

      - name: Commit validated IEEE 7014 tranche
        run: |
          set -e
          git config user.name "CAM-Initiative"
          git config user.email "aeon.tier@protonmail.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "EXTREQ-08: assure IEEE 7014 fidelity"
          git push origin HEAD:agent/extreq-05-ieee-7014-1-fidelity-review
