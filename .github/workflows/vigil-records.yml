name: VIGIL records — August 19 intake execution

on:
  push:
    branches:
      - agent/instrumental-coercive-influence-capability-revalidation
    paths:
      - "vigil/**"
      - ".github/workflows/vigil-records.yml"
      - ".github/workflows/vigil-intake-2026-08-19.yml"

concurrency:
  group: vigil-records-intake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Execute staged intake transformation
        shell: bash
        run: |
          set -euo pipefail
          awk '/^          python - <<'\''PY'\''$/{flag=1;next} /^          PY$/{if(flag){exit}} flag{sub(/^          /,""); print}' \
            .github/workflows/vigil-intake-2026-08-19.yml > /tmp/vigil-intake.py
          test -s /tmp/vigil-intake.py
          python /tmp/vigil-intake.py

      - name: Normalise derived FM context and generated routing state
        run: |
          python vigil/scripts/reconcile-fm-system-context.py
          python vigil/scripts/audit-vigil-triage.py
          python vigil/scripts/route-vigil-records.py

      - name: Validate governed intake records
        run: |
          python vigil/scripts/test_validate_vigil_records.py
          python vigil/tests/test_failure_mode_facets.py
          python vigil/scripts/validate-failure-mode-facets.py
          python vigil/scripts/validate-vigil-records.py
          python vigil/tests/test_audit_vigil_triage.py
          python vigil/scripts/audit-vigil-triage.py --check
          python vigil/tests/test_authorship_provenance.py
          python vigil/scripts/validate-authorship-provenance.py
          python vigil/tests/test_reconcile_fm_system_context.py
          python vigil/scripts/reconcile-fm-system-context.py --check
          python vigil/scripts/route-vigil-records.py --check

      - name: Build VIGIL indexes
        run: |
          python vigil/scripts/build-vigil-records.py
          python vigil/scripts/enrich-vigil-indexes.py
          python vigil/scripts/build-vigil-learn-records.py

      - name: Confirm expected allocations
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          failures=json.loads(Path('vigil/VIGIL.Failures.Index.json').read_text())
          observations=json.loads(Path('vigil/VIGIL.Observations.Index.json').read_text())
          fids={r['id'] for r in failures['records']}
          oids={r['id'] for r in observations['records']}
          assert {'VIGIL-2026-FM-0062','VIGIL-2026-FM-0063','VIGIL-2026-FM-0064','VIGIL-2026-FM-0065'} <= fids
          assert {'VIGIL-2026-OBS-0028','VIGIL-2026-OBS-0029','VIGIL-2026-OBS-0030'} <= oids
          assert failures['record_count'] >= 65
          assert observations['record_count'] >= 30
          PY

      - name: Commit validated intake package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find vigil -type d -name __pycache__ -prune -exec rm -rf {} +
          find vigil -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A -- vigil
          git status --short
          if git diff --cached --quiet; then
            echo "No intake changes to commit."
          else
            git commit -m "Ingest August 19 VIGIL incident evidence"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
