name: One-time VIGIL source provenance migration

on:
  push:
    branches:
      - governance/learn-record-exemplar
    paths:
      - "vigil/scripts/migrate-vigil-source-provenance.py"
      - "vigil/scripts/test_vigil_source_provenance.py"
      - ".github/workflows/source-provenance-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: governance/learn-record-exemplar
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Test classification rules
        run: python vigil/scripts/test_vigil_source_provenance.py

      - name: Backfill source residence and role
        run: python vigil/scripts/migrate-vigil-source-provenance.py

      - name: Verify deterministic migration
        run: python vigil/scripts/migrate-vigil-source-provenance.py --check

      - name: Validate migrated source provenance
        run: python vigil/scripts/validate-vigil-source-provenance.py

      - name: Commit migration and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/source-provenance-migration.yml
          git add \
            .github/workflows/source-provenance-migration.yml \
            vigil/VIGIL.Schema.json \
            vigil/templates \
            vigil/records \
            vigil/migrations/source-provenance-migration-2026-07-29.json
          if git diff --cached --quiet; then
            echo "Source provenance migration produced no changes."
          else
            git commit -m "Backfill VIGIL source residence and roles"
            git push origin HEAD:governance/learn-record-exemplar
          fi
