name: SIAI research snapshot preflight

on:
  push:
    branches:
      - chore/siai-2026-release-readiness-20261023
      - main
    paths:
      - "vigil/releases/siai-2026/**"
      - "vigil/docs/reviews/**"
      - "vigil/docs/maintenance/**"
      - ".github/workflows/siai-research-preflight.yml"
      - "README.md"
      - "CITATION.cff"
      - "LICENSE.md"
      - "RIGHTS.json"
      - "ZENODO-RELEASE-READINESS.md"
  pull_request:
    paths:
      - "vigil/releases/siai-2026/**"
      - "vigil/docs/reviews/**"
      - "vigil/docs/maintenance/**"
      - ".github/workflows/siai-research-preflight.yml"
      - "README.md"
      - "CITATION.cff"
      - "LICENSE.md"
      - "RIGHTS.json"
      - "ZENODO-RELEASE-READINESS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build and verify research checksum inventory
        run: |
          python -m py_compile vigil/releases/siai-2026/build_research_snapshot.py
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python vigil/releases/siai-2026/build_research_snapshot.py --write --require-main
            python vigil/releases/siai-2026/build_research_snapshot.py --check --require-main
          else
            python vigil/releases/siai-2026/build_research_snapshot.py --write
            python vigil/releases/siai-2026/build_research_snapshot.py --check
          fi
      - name: Print exact snapshot identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("vigil/releases/siai-2026/RESEARCH-SNAPSHOT.preflight.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("Frozen source:", d["source_commit"])
          print("Incidents:", d["corpus"]["incident_json_count"])
          print("Files:", d["inventory"]["file_count"])
          print("SHA-256:", d["inventory"]["canonical_entry_stream_sha256"])
          print("State:", d["state"])
          PY
      - name: Inventory curation dependencies and Incident classification statuses
        run: |
          python -m py_compile vigil/releases/siai-2026/audit_repository_retention.py
          python vigil/releases/siai-2026/audit_repository_retention.py
      - name: Upload manifest (preflight only; not a release)
        uses: actions/upload-artifact@v4
        with:
          name: siai-2026-research-snapshot-preflight
          path: |
            vigil/releases/siai-2026/RESEARCH-SNAPSHOT.preflight.json
            vigil/releases/siai-2026/REPOSITORY-RETENTION-AUDIT.json
          if-no-files-found: error
          retention-days: 30

  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Checkout pinned PR #166 transfer for preservation comparison
        uses: actions/checkout@v6
        with:
          repository: CAM-Initiative/Vigil
          ref: 99347d4ab5c153558c49eb888c31786b0e19214e
          path: pr166-source
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned paper-case historical baseline
        uses: actions/checkout@v6
        with:
          repository: CAM-Initiative/Vigil
          ref: bf58646d22c90a86c8333ac9bc7fe83ac856589c
          path: siai-paper-baseline
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned INC-100+ targeted historical baseline
        uses: actions/checkout@v6
        with:
          repository: CAM-Initiative/Vigil
          ref: abc976ee2a4457d7f3d7738cfeeefb52d54c0c55
          path: siai-targeted-baseline
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact historical baseline checkout identities
        run: |
          test "$(git -C siai-paper-baseline rev-parse HEAD)" = "bf58646d22c90a86c8333ac9bc7fe83ac856589c"
          test "$(git -C siai-targeted-baseline rev-parse HEAD)" = "abc976ee2a4457d7f3d7738cfeeefb52d54c0c55"
      - name: Verify all 81 INC-100+ canonical transfers from PR #166
        run: python vigil/releases/siai-2026/validate_inc100_transfer.py --source-root pr166-source
      - name: Install test dependency
        run: python -m pip install "jsonschema==4.26.0"
      - name: Validate taxonomy and rights
        run: |
          python vigil/taxonomy/validate_taxonomy.py
          python vigil/scripts/validate-vigil-rights.py
      - name: Validate records and provenance
        run: |
          python vigil/scripts/validate-vigil-records.py
          python vigil/scripts/validate-vigil-public-records.py
          python vigil/scripts/validate-vigil-source-provenance.py
          python vigil/scripts/validate-vigil-interpretive-provenance.py
          python vigil/scripts/validate-authorship-provenance.py
          python vigil/scripts/validate-vigil-system-components.py
      - name: Validate external governance requirements
        run: |
          python vigil/scripts/validate-external-requirement-fidelity.py
          python vigil/scripts/validate-external-requirement-metadata.py
      - name: Run complete regression suite
        run: python -m unittest discover -s vigil/tests -p 'test_*.py'
      - name: Verify paper-case v0.8.1 non-destructive canonical promotions
        run: |
          # Exact pre-promotion source; no moving-branch baseline.
          for id in 000001 000002 000003 000004 000005 000006 000007 000008 000009 000010 000012 000013 000014 000015 000016 000018 000019 000020 000117 000129; do
            manifest="vigil/docs/reviews/2026-10-24-siai-paper-v081/INC-${id}-081-REVIEW.json"
            if [ "$id" = "000008" ]; then
              manifest="vigil/docs/reviews/2026-10-25-siai-inc008-targeted-v081/INC-000008-081-DECISION.json"
            fi
            python vigil/scripts/validate-vigil-incident-rebuild.py \
              --baseline-file "siai-paper-baseline/vigil/records/incidents/VIGIL-INC-${id}.json" \
              --candidate-file "vigil/records/incidents/VIGIL-INC-${id}.json" \
              --manifest "$manifest"
          done
      - name: Verify INC-100+ targeted v0.8.1 canonical promotions
        run: |
          # Exact pre-promotion release-branch commit, not a moving baseline.
          for id in 000119 000121 000162 000187 000204; do
            python vigil/scripts/validate-vigil-incident-rebuild.py --baseline-file "siai-targeted-baseline/vigil/records/incidents/VIGIL-INC-${id}.json" --candidate-file "vigil/records/incidents/VIGIL-INC-${id}.json" --manifest "vigil/docs/reviews/2026-10-25-siai-081-targeted-100-plus/INC-${id}-081-TARGETED-REVIEW.json"
          done
      - name: Apply committed textbook case-study publication eligibility
        run: |
          python vigil/taxonomy/filter_publication_case_examples.py
          python vigil/taxonomy/filter_publication_case_examples.py --check
      - name: Confirm deterministic jurisdiction projection
        run: python vigil/scripts/build-vigil-jurisdiction-index.py --check
      - name: Assert validators did not change governed sources
        run: |
          git diff --exit-code -- vigil/records vigil/taxonomy vigil/methodologies vigil/external_governance vigil/references vigil/templates vigil/VIGIL.Schema.json
