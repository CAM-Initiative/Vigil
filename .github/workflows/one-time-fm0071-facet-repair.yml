name: One-time FM-0071 facet repair

on:
  push:
    branches:
      - agent/hugging-face-authority-reconciliation
    paths:
      - ".github/workflows/one-time-fm0071-facet-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hugging-face-authority-reconciliation
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Repair FM-0071 controlled facet values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("vigil/records/failures/2026/VIGIL-2026-FM-0071.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          facets = data["failure_classification"]["faceted_analysis"]

          expected = {
              "cause_status": "reproduced-and-incident-observed",
              "evidence_state": "reproduced-and-real-world-incident-evidence",
              "propagation": "local-or-cross-session",
              "execution_pattern": "looping-or-session-reset",
          }
          replacement = {
              "cause_status": "reproduced",
              "evidence_state": "reproduced",
              "propagation": "local",
              "execution_pattern": "looping",
          }

          for key, value in expected.items():
              actual = facets.get(key)
              if actual != value:
                  raise SystemExit(
                      f"Refusing repair: {key} expected {value!r}, found {actual!r}"
                  )

          facets.update(replacement)
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Validate failure-mode facets
        run: |
          python vigil/tests/test_failure_mode_facets.py
          python vigil/scripts/validate-failure-mode-facets.py

      - name: Verify repair scope
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "vigil/records/failures/2026/VIGIL-2026-FM-0071.json" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit facet repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/records/failures/2026/VIGIL-2026-FM-0071.json
          git commit -m "Repair FM-0071 controlled facet values"
          git push
