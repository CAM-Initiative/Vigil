name: Fix PROP-0024 verification scope

on:
  push:
    branches:
      - governance/learn-record-exemplar
    paths:
      - "scripts/fix-prop-0024-verification-scope.py"
      - ".github/workflows/fix-prop-0024-verification-scope.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: governance/learn-record-exemplar
          fetch-depth: 0
      - name: Repair proposal verification scope
        run: python scripts/fix-prop-0024-verification-scope.py
      - name: Commit repaired record
        run: |
          if git diff --quiet -- vigil/records/proposals/2026/VIGIL-2026-PROP-0024.json; then
            echo "PROP-0024 already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/records/proposals/2026/VIGIL-2026-PROP-0024.json
          git commit -m "Fix PROP-0024 proposal verification scope"
          git push origin HEAD:governance/learn-record-exemplar
