name: One-time taxonomy case-study redesign

on:
  push:
    branches:
      - agent/hugging-face-authority-reconciliation
    paths:
      - ".github/workflows/one-time-taxonomy-case-study-redesign.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Refine Case Study evidence focus
        run: |
          python vigil/scripts/one-time-taxonomy-case-study-source-focus.py
          python -m py_compile vigil/taxonomy/render_taxonomy.py

      - name: Generate redesigned publication
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify selection and publication contract
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          module_path = Path('vigil/taxonomy/render_taxonomy.py')
          spec = importlib.util.spec_from_file_location('taxonomy_renderer', module_path)
          renderer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(renderer)

          source = module_path.read_text(encoding='utf-8')
          required = [
              'Relevance to this class:',
              'Multi-vendor evidence',
              'coverage across distinct failure classes',
              'font-family:Helvetica,Arial,sans-serif',
              'def _source_quality',
              'def _focused_excerpt',
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f'missing redesign token: {token}')
          forbidden = [
              'Publication numbering is navigational only. Immutable VIGIL identifiers remain authoritative.',
              '<strong>What happened</strong>',
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit(f'obsolete publication text still present: {token}')

          families = renderer.load_catalogue()
          examples = renderer.load_case_examples()
          total = 0
          print('Selected case-study diagnostics:')
          for family in families:
              selected = renderer.select_family_case_examples(family, examples)
              rows = []
              for class_id, class_examples in selected.items():
                  for example in class_examples:
                      context = renderer.case_study_context(example)
                      rows.append(
                          f"{example.get('failure_mode_id')}:{class_id}:{context.get('severity')}:{context.get('system_label')}:{context.get('source_publisher')}:{context.get('source_date')}"
                      )
              total += len(rows)
              print(f"  {family['family']['family_id']}: {len(rows)} -> " + (' | '.join(rows) if rows else 'none'))
          if total == 0:
              raise SystemExit('no eligible case studies selected')
          print(f'Total selected cases: {total}')

          pdf = Path('vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf')
          if not pdf.exists() or pdf.stat().st_size < 5000 or not pdf.read_bytes().startswith(b'%PDF-'):
              raise SystemExit('redesigned taxonomy PDF was not generated correctly')
          print(f'PDF: {pdf.stat().st_size:,} bytes')
          PY

      - name: Upload PDF for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: redesigned-taxonomy-pdf-v2
          path: vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if-no-files-found: error

      - name: Commit renderer and generated publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/taxonomy/render_taxonomy.py
          git add vigil/taxonomy/generated/*.html
          git add vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if git diff --cached --quiet; then
            echo "Redesigned publication already current."
          else
            git commit -m "Refine taxonomy case-study evidence focus"
            git push
          fi
