name: Finalize Transluce broader review

on:
  push:
    branches:
      - design/external-alignment-classification-crosswalk
    paths:
      - ".github/workflows/transluce-review-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Reconcile current main into working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Align adjudication matrix with published taxonomy release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          taxonomy_path = Path("vigil/taxonomy/VIGIL.FailureTaxonomy.Index.json")
          matrix_path = Path("vigil/taxonomy/VIGIL.FailureTaxonomy.Adjudications.json")

          taxonomy = json.loads(taxonomy_path.read_text(encoding="utf-8"))
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          version = taxonomy["standard"]["version"]
          prior = matrix.get("taxonomy_version")

          print(f"Published taxonomy version: {version}")
          print(f"Adjudication matrix version: {prior}")

          if prior != version:
              matrix["taxonomy_version"] = version
              matrix_path.write_text(json.dumps(matrix, indent=2) + "\n", encoding="utf-8")
              print(f"Aligned adjudication matrix taxonomy_version: {prior} -> {version}")
          PY

      - name: Refresh generated Incident indexes
        run: python vigil/scripts/build-vigil-public-records.py

      - name: Test source provenance classification
        run: python vigil/tests/test_vigil_source_provenance.py

      - name: Validate active source provenance
        run: python vigil/scripts/validate-vigil-source-provenance.py

      - name: Test VIGIL record validator rules
        run: python vigil/tests/test_validate_vigil_record_rules.py

      - name: Test public Case File prose quality
        run: python vigil/tests/test_public_prose_quality.py

      - name: Test active VIGIL pipeline state
        run: python vigil/tests/test_vigil_pipeline_state.py

      - name: Test and validate authorship provenance
        run: |
          python vigil/tests/test_authorship_provenance.py
          python vigil/scripts/validate-authorship-provenance.py

      - name: Validate active system-component metadata
        run: python vigil/scripts/validate-vigil-system-components.py

      - name: Validate Incident interpretive provenance
        run: python vigil/scripts/validate-vigil-interpretive-provenance.py

      - name: Validate Incident records and public projections
        run: |
          python vigil/scripts/validate-vigil-records.py
          python vigil/scripts/validate-vigil-public-records.py

      - name: Validate current taxonomy and adjudications
        run: |
          python vigil/taxonomy/validate_taxonomy.py
          python vigil/scripts/validate-vigil-taxonomy-adjudications.py
          python vigil/tests/test_vigil_taxonomy_adjudication_roles.py
          python vigil/scripts/validate-vigil-rights.py
          python vigil/tests/test_failure_taxonomy.py
          python vigil/tests/test_taxonomy_release_modes.py
          python vigil/tests/test_taxonomy_publication_references.py

      - name: Rebuild and verify publication case projection
        run: |
          python vigil/scripts/build-vigil-public-records.py
          python vigil/taxonomy/filter_publication_case_examples.py
          python vigil/taxonomy/filter_publication_case_examples.py --check

      - name: Verify build did not mutate governed source records
        run: |
          if ! git diff --quiet -- vigil/records vigil/templates vigil/VIGIL.Schema.json vigil/taxonomy/families; then
            echo "Validation/build automation modified governed canonical inputs."
            git diff --name-status -- vigil/records vigil/templates vigil/VIGIL.Schema.json vigil/taxonomy/families
            exit 1
          fi

      - name: Commit generated outputs and remove one-shot workflow
        run: |
          find vigil -type d -name __pycache__ -prune -exec rm -rf {} +
          find vigil -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add             vigil/VIGIL.Incidents.Index.json             vigil/VIGIL.Registry.Index.json             vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json
          git rm .github/workflows/transluce-review-finalize.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Finalize Transluce broader corpus review"
          fi
          git push
