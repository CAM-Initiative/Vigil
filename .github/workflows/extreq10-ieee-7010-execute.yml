name: EXTREQ-10 IEEE 7010 execute

on:
  push:
    branches:
      - agent/extreq-05-ieee-7014-1-fidelity-review
    paths:
      - .github/workflows/extreq10-ieee-7010-execute.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/extreq-05-ieee-7014-1-fidelity-review
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply IEEE 7010 fidelity enrichment
        run: python vigil/scripts/extreq10_ieee_7010_fidelity.py

      - name: Update regression contracts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path("vigil/tests/test_external_requirement_metadata.py")
          t=p.read_text()
          t,n=re.subn(r'assert len\(ids\) == \d+', 'assert len(ids) == 899', t, count=1)
          assert n==1
          p.write_text(t)

          p=Path("vigil/tests/test_external_requirement_fidelity.py")
          t=p.read_text()
          t,n=re.subn(
              r'self\.assertEqual\(summary\["fidelity_assured_effective_complete_sources"\], \d+\)',
              'self.assertEqual(summary["fidelity_assured_effective_complete_sources"], 15)', t, count=1)
          assert n==1
          needle='        self.assertEqual(status[("IEEE-7001", "2021")], "assured")\n'
          assert needle in t
          if 'status[("IEEE-7010", "2020")]' not in t:
              t=t.replace(needle, needle+'        self.assertEqual(status[("IEEE-7010", "2020")], "assured")\n')
          p.write_text(t)
          PY

      - name: Add IEEE 7010 regression test
        run: |
          cat > vigil/tests/test_ieee_7010_fidelity.py <<'PY'
          #!/usr/bin/env python3
          import json
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          REQ=ROOT/"external_governance"/"requirements"
          records=json.loads((REQ/"requirements"/"IEEE-7010"/"2020.json").read_text())
          DIGEST="0402e2db473736dc08f280218b895547c37d0c1a9e97a92c0432e96f9d888342"
          assert len(records)==18
          ids={r["requirement_id"] for r in records}
          assert len(ids)==18
          assert all(r["requirement_posture"]=="recommended-practice" for r in records)
          assert all(r["source_review_date"]=="2026-09-04" for r in records)
          assert all(r["interpretation_provenance"]["reviewed_source_digest"]==DIGEST for r in records)
          ledger=json.loads((REQ/"metadata-review.json").read_text())
          by={e["requirement_id"]:e for e in ledger["entries"]}
          fields=("applicable_actor","governed_object","timing_or_frequency","required_artefacts","evidence_expectation","verification_method","applicability_conditions","exceptions_or_qualifications")
          for r in records:
              assert all(by[r["requirement_id"]]["field_status"][f]!="review-required" for f in fields)
          fid=json.loads((REQ/"source-fidelity.json").read_text())
          f=next(e for e in fid["entries"] if e["external_source_id"]=="IEEE-7010" and e["source_version"]=="2020")
          assert f["fidelity_status"]=="assured" and f["effective_extraction_status"]=="complete"
          assert set(f["audited_requirement_ids"])==ids
          ass=json.loads((REQ/"source-review-assurance.json").read_text())
          a=next(e for e in ass["source_reviews"] if e["external_source_id"]=="IEEE-7010" and e["source_version"]=="2020")
          assert a["reviewed_source_digest"]["digest"]==DIGEST
          assert a["reviewed_source_digest"]["access_basis"]=="licensed-primary"
          print("IEEE 7010 fidelity regression contract valid")
          PY
          python vigil/tests/test_ieee_7010_fidelity.py

      - name: Write EXTREQ-10 audit note
        run: |
          cat > vigil/docs/audits/external-requirements/EXTREQ-10-IEEE-7010-FIDELITY-REVIEW.md <<'MD'
          # EXTREQ-10 — IEEE 7010-2020 fidelity review

          **Source:** IEEE Std 7010-2020
          **VIGIL source:** EXT-8E377EF5CE66
          **Review basis:** lawfully accessed licensed primary text
          **Review date:** 2026-09-04
          **Reviewed source SHA-256:** 0402e2db473736dc08f280218b895547c37d0c1a9e97a92c0432e96f9d888342

          ## Disposition

          Direct review confirmed that the 18 established analytical records provide bounded coverage of the five Clause 4 well-being impact-assessment activities and their operative recommended tasks. All 18 established EXTREQ identities and recommended-practice postures are preserved. No new requirement identity was added or removed.

          Clause 5 implementation guidance and annex examples were reviewed as context but are not separately decomposed where they do not create an additional Clause 4 governance proposition.

          ## Metadata and provenance

          Source-explicit timing, artefacts, evidence, verification cues, applicability and qualifications are populated. Source silence is recorded without inference. Existing source-supported actor and governed-object values are retained. Licensed IEEE text is not stored in VIGIL, and no human review or verification is claimed.

          ## Stability

          Retain all 18 reviewed identities and repeat fidelity review only on material source revision or a demonstrated record-specific defect.
          MD

      - name: Regenerate and validate
        run: |
          set -e
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-metadata.py --write-report
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-fidelity.py
          python vigil/scripts/manage-external-requirements.py build
          python vigil/scripts/manage-external-requirements.py validate --check-generated
          python vigil/tests/test_ieee_7010_fidelity.py
          PYTHONPATH=vigil/scripts python vigil/tests/test_external_requirement_metadata.py
          python vigil/tests/test_external_requirement_fidelity.py
          python -m unittest vigil/tests/test_external_requirements.py vigil/tests/test_external_sources.py

      - name: Remove one-off EXTREQ-10 machinery
        run: |
          rm -f vigil/scripts/extreq10_ieee_7010_fidelity.py
          rm -f .github/workflows/extreq10-ieee-7010-execute.yml

      - name: Commit validated IEEE 7010 tranche
        run: |
          set -e
          git config user.name "CAM-Initiative"
          git config user.email "aeon.tier@protonmail.com"
          git add -A
          git diff --cached --check
          git commit -m "EXTREQ-10: assure IEEE 7010 fidelity"
          git push origin HEAD:agent/extreq-05-ieee-7014-1-fidelity-review
