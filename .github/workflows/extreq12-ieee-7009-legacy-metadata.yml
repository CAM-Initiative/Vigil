name: EXTREQ-12 IEEE 7009 legacy metadata enrichment

on:
  push:
    branches:
      - agent/extreq-05-ieee-7014-1-fidelity-review
    paths:
      - .github/workflows/extreq12-ieee-7009-legacy-metadata.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/extreq-05-ieee-7014-1-fidelity-review
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply IEEE 7009 legacy metadata closure
        run: python vigil/scripts/extreq12_ieee_7009_legacy_metadata.py

      - name: Add IEEE 7009 legacy metadata regression
        run: |
          cat > vigil/tests/test_ieee_7009_legacy_metadata.py <<'PY'
          #!/usr/bin/env python3
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          REQ = ROOT / "external_governance" / "requirements"
          TARGETS = {
              "EXTREQ-528978BC3EB32446",
              "EXTREQ-BBE358DBC3A6FD24",
              "EXTREQ-C2FC30A1E260F4C1",
              "EXTREQ-4041B6E279EF30CC",
          }
          FIELDS = (
              "applicable_actor","governed_object","timing_or_frequency","required_artefacts",
              "evidence_expectation","verification_method","applicability_conditions",
              "exceptions_or_qualifications",
          )

          records = json.loads((REQ/"requirements"/"IEEE-7009"/"2024.json").read_text())
          by_id = {r["requirement_id"]: r for r in records}
          assert TARGETS <= set(by_id)
          for rid in TARGETS:
              r = by_id[rid]
              assert r["timing_or_frequency"]
              assert r["required_artefacts"]
              assert r["evidence_expectation"]
              assert r["verification_method"]
              assert r["exceptions_or_qualifications"]
              assert r["related_external_requirements"]

          ledger = json.loads((REQ/"metadata-review.json").read_text())
          review = {e["requirement_id"]: e for e in ledger["entries"]}
          affected = {
              "timing_or_frequency", "required_artefacts", "evidence_expectation",
              "verification_method", "exceptions_or_qualifications",
          }
          for rid in TARGETS:
              s = review[rid]["field_status"]
              assert s["applicable_actor"] == "populated-reviewed"
              assert s["governed_object"] == "populated-reviewed"
              assert s["applicability_conditions"] == "populated-reviewed"
              assert all(s[f] == "review-required" for f in affected)

          backlog = json.loads((REQ/"reextraction-backlog.json").read_text())
          ieee = [e for e in backlog["entries"] if e["external_source_id"] == "IEEE-7009"]
          assert {e["current_requirement_id"] for e in ieee} == TARGETS
          assert all(e["review_status"] == "in-review" for e in ieee)
          assert all(e["recommended_repair"] == "semantic-decomposition-with-identity-migration" for e in ieee)

          fidelity = json.loads((REQ/"source-fidelity.json").read_text())
          f = next(e for e in fidelity["entries"] if e["external_source_id"] == "IEEE-7009" and e["source_version"] == "2024")
          assert f["fidelity_status"] == "requires-reextraction"
          assert f["effective_extraction_status"] == "partial"
          assert len(f["known_fidelity_gaps"]) == 2

          assert len(records) == 67
          print("IEEE 7009 legacy metadata closure regression valid")
          PY
          python vigil/tests/test_ieee_7009_legacy_metadata.py

      - name: Write EXTREQ-12 audit note
        run: |
          cat > vigil/docs/audits/external-requirements/EXTREQ-12-IEEE-7009-LEGACY-METADATA-CLOSURE.md <<'MD'
          # EXTREQ-12 — IEEE 7009-2024 legacy aggregate metadata closure

          **Source:** IEEE Std 7009-2024
          **VIGIL source:** EXT-564A4CAA4F00
          **Review basis:** lawfully accessed licensed primary text
          **Review date:** 2026-09-04
          **Reviewed source SHA-256:** 9fb640fd57202fcc1c90aec0b6b767bf5c4621bfdefa7911c5e102425a83b133

          ## Scope

          This pass closes the remaining field-level metadata decisions for four preserved legacy aggregate identities covering Clause 6.1(a-c), Clause 6.1(d-e), DIOP1-3 and DIOP4-6.

          No EXTREQ identity is retired, deleted, renumbered or replaced. The linked source-native atomic complement records remain the preferred independent assessment units.

          ## Metadata disposition

          Timing, required artefacts, evidence expectations, verification methods and qualifications are now populated for all four aggregates from direct primary-text review. Actor, governed object and applicability were already source-reviewed.

          Source-supported provisional values are now present for the five affected metadata dimensions on all four aggregates. Under the VIGIL fidelity contract, those dimensions remain formally review-required while the re-extraction defect is open. The four semantic decomposition findings therefore remain visible in both the metadata ledger and the re-extraction backlog.

          ## Fidelity disposition

          IEEE 7009 remains requires-reextraction / effectively partial. The residual defect is intentionally visible: four legacy compound identities remain canonical alongside linked atomic constituents.

          Removing that residual defect would require an explicit identity-retirement decision. This pass does not make that decision.

          Licensed IEEE text is not stored in VIGIL and no human review or verification is claimed.
          MD

      - name: Regenerate and validate
        run: |
          set -e
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-metadata.py --write-report
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-fidelity.py
          python vigil/scripts/manage-external-requirements.py build
          python vigil/scripts/manage-external-requirements.py validate --check-generated
          python vigil/tests/test_ieee_7009_legacy_metadata.py
          python vigil/tests/test_ieee_7009_fidelity.py
          PYTHONPATH=vigil/scripts python vigil/tests/test_external_requirement_metadata.py
          python vigil/tests/test_external_requirement_fidelity.py
          python -m unittest vigil/tests/test_external_requirements.py vigil/tests/test_external_sources.py

      - name: Assert expected metadata state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("vigil/external_governance/requirements/metadata-review-report.json")
          d = json.loads(p.read_text())
          s = d.get("summary", d)
          print(s)
          assert s["metadata_complete"] == 905
          assert s["review_required_records"] == 85
          assert s["review_required_fields"] == 668
          assert s["reextraction_backlog_entries"] == 4
          PY

      - name: Remove one-off EXTREQ-12 machinery
        run: |
          rm -f vigil/scripts/extreq12_ieee_7009_legacy_metadata.py
          rm -f .github/workflows/extreq12-ieee-7009-legacy-metadata.yml

      - name: Commit validated IEEE 7009 metadata enrichment
        run: |
          set -e
          git config user.name "CAM-Initiative"
          git config user.email "aeon.tier@protonmail.com"
          git add -A
          git diff --cached --check
          git commit -m "EXTREQ-12: enrich IEEE 7009 legacy metadata"
          git push origin HEAD:agent/extreq-05-ieee-7014-1-fidelity-review
