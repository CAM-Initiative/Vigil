name: Reconcile FM system context once

on:
  push:
    branches:
      - agent/failure-taxonomy-prototype
    paths:
      - .github/workflows/reconcile-fm-system-context-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/failure-taxonomy-prototype
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run canonical reconciler
        run: |
          python vigil/scripts/reconcile-fm-system-context.py --write-report
          python vigil/scripts/reconcile-fm-system-context.py --check
          git diff --check
      - name: Commit deterministic reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/records/failures vigil/docs/reviews/FM-SYSTEM-CONTEXT-01-evidence-rollup-reconciliation.md
          if git diff --cached --quiet; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git commit -m "Reconcile post-migration FM system-context provenance"
          git push origin HEAD:agent/failure-taxonomy-prototype
