name: Temporary repair taxonomy publication workflow test

on:
  push:
    branches:
      - agent/bounded-incident-classification-provenance-repair
    paths:
      - ".github/workflows/temporary-repair-taxonomy-publication-test.yml"

permissions:
  contents: write

jobs:
  repair-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bounded-incident-classification-provenance-repair
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Align publication workflow regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vigil/tests/test_incident_registry.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def test_taxonomy_publication_workflow_is_html_only(self):
        workflow = (ROOT / ".github" / "workflows" / "taxonomy-publications.yml").read_text(
            encoding="utf-8"
        )
        self.assertNotIn("--pdf", workflow)
        self.assertNotIn("*.pdf", workflow)
        self.assertNotIn("weasyprint", workflow)
        self.assertNotIn("Verify generated publications are current", workflow)
        self.assertIn("--taxonomy-examples-only", workflow)
        self.assertIn("generated/*.html", workflow)
'''
          new = '''    def test_taxonomy_publication_workflow_keeps_pdf_main_owned(self):
        workflow = (ROOT / ".github" / "workflows" / "taxonomy-publications.yml").read_text(
            encoding="utf-8"
        )
        self.assertNotIn("Verify generated publications are current", workflow)
        self.assertIn("--taxonomy-examples-only", workflow)
        self.assertIn("Generate HTML publication for pull-request validation", workflow)
        self.assertIn("Install PDF renderer on main publication build", workflow)
        self.assertIn("weasyprint==69.0", workflow)
        self.assertIn("Generate HTML and PDF publications on main", workflow)
        self.assertIn("--pdf", workflow)
        self.assertIn("generated/*.html", workflow)
        self.assertIn("generated/*.pdf", workflow)
        self.assertIn("if: github.event_name != 'pull_request'", workflow)
'''
          if old not in text:
              raise SystemExit("Expected HTML-only taxonomy publication test block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit publication workflow test repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/tests/test_incident_registry.py
          git commit -m "test: enforce main-owned taxonomy PDF publication contract"
          git push origin HEAD:agent/bounded-incident-classification-provenance-repair
