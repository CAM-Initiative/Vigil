name: One-shot housekeeping FM reconciliation

on:
  push:
    branches:
      - housekeeping/scripts-tests-audits
    paths:
      - ".github/workflows/housekeeping-fm-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: housekeeping/scripts-tests-audits
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Reconcile failure-mode system context
        run: |
          python vigil/scripts/reconcile-fm-system-context.py
          python vigil/scripts/reconcile-fm-system-context.py --check

      - name: Verify bounded change scope
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^vigil/records/failures/.+\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Reconciler changed files outside canonical failure-mode JSON records:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --stat -- vigil/records/failures

      - name: Commit deterministic reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/records/failures
          if git diff --cached --quiet; then
            echo "No stale FM system-context records found."
          else
            git commit -m "Reconcile failure-mode system context after housekeeping"
            git push origin HEAD:housekeeping/scripts-tests-audits
          fi
