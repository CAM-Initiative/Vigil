name: One-time integrate turn-state taxonomy into Incident repair branch

on:
  push:
    branches:
      - agent/incident-record-quality-repair
    paths:
      - ".github/workflows/one-time-integrate-turn-state-into-incident-repair.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/incident-record-quality-repair
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch accidental taxonomy branch
        run: git fetch origin agent/synthetic-turn-taking-classification

      - name: Integrate branch while preserving Incident repair conflict hunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit -X ours origin/agent/synthetic-turn-taking-classification

      - name: Rebuild curated Incident registry
        run: python vigil/scripts/build-incident-registry.py

      - name: Validate Incident migration and VIGIL records
        run: |
          python vigil/tests/test_incident_registry.py
          python vigil/scripts/build-incident-migration-decisions.py
          python vigil/scripts/build-incident-migration-crosswalk.py
          python vigil/scripts/validate-incident-migration.py
          python vigil/scripts/build-vigil-public-records.py
          python vigil/scripts/enrich-vigil-indexes.py
          python vigil/scripts/validate-vigil-records.py

      - name: Validate taxonomy contract
        run: python vigil/taxonomy/validate_taxonomy.py

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint==69.0

      - name: Rebuild taxonomy Case Study projection
        run: python vigil/scripts/build-vigil-records.py --taxonomy-examples-only

      - name: Rebuild taxonomy publications
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify generated publication artefacts
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("vigil/taxonomy/generated/VIGIL.FailureTaxonomy.FullReference.html")
          pdf = Path("vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf")
          if not html.exists() or html.stat().st_size < 1000:
              raise SystemExit("Full-reference HTML was not generated correctly")
          if not pdf.exists() or pdf.stat().st_size < 5000 or not pdf.read_bytes().startswith(b"%PDF-"):
              raise SystemExit("Full-reference PDF was not generated correctly")
          print(f"HTML: {html.stat().st_size:,} bytes")
          print(f"PDF: {pdf.stat().st_size:,} bytes")
          PY

      - name: Commit integrated repair
        run: |
          git add -A
          git commit -m "Integrate synthetic turn-state taxonomy into Incident quality repair"
          git push origin HEAD:agent/incident-record-quality-repair
