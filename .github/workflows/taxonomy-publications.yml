name: VIGIL Observatory taxonomy publications
# Publication styling consumes repository-pinned CAM brand assets via render_taxonomy.py.

on:
  push:
    branches:
      - main
    paths:
      - "vigil/taxonomy/VIGIL.FailureTaxonomy.Index.json"
      - "vigil/taxonomy/families/**"
      - "vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json"
      - "vigil/records/incidents/**"
      - "vigil/VIGIL.Incidents.Index.json"
      - "vigil/scripts/build-vigil-records.py"
      - "vigil/taxonomy/filter_publication_case_examples.py"
      - "vigil/taxonomy/prepare_taxonomy_release.py"
      - "vigil/taxonomy/validate_taxonomy.py"
      - "vigil/taxonomy/render_taxonomy.py"
      - "vigil/taxonomy/assets/**"
      - ".github/workflows/taxonomy-publications.yml"
  pull_request:
    paths:
      - "vigil/taxonomy/VIGIL.FailureTaxonomy.Index.json"
      - "vigil/taxonomy/families/**"
      - "vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json"
      - "vigil/records/incidents/**"
      - "vigil/VIGIL.Incidents.Index.json"
      - "vigil/scripts/build-vigil-records.py"
      - "vigil/taxonomy/filter_publication_case_examples.py"
      - "vigil/taxonomy/prepare_taxonomy_release.py"
      - "vigil/taxonomy/validate_taxonomy.py"
      - "vigil/taxonomy/render_taxonomy.py"
      - "vigil/taxonomy/assets/**"
      - ".github/workflows/taxonomy-publications.yml"
  workflow_dispatch:

concurrency:
  group: vigil-taxonomy-publications-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Working branches retain the last published taxonomy version while edits are
      # in review. Once those edits land on main, prepare exactly one dataset/book
      # release for the whole merged tranche before enforcing published alignment.
      - name: Prepare taxonomy dataset release on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python vigil/taxonomy/prepare_taxonomy_release.py

      - name: Validate taxonomy contract and release ledger
        shell: bash
        run: |
          set +e
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            python vigil/taxonomy/validate_taxonomy.py --published-release
          else
            python vigil/taxonomy/validate_taxonomy.py
          fi
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path("vigil/taxonomy/validate_taxonomy.py")
          spec = importlib.util.spec_from_file_location("validate_taxonomy", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          loaded = []
          family_ids = set()
          class_ids = set()
          for family_path in sorted(Path("vigil/taxonomy/families").glob("*.json")):
              data = json.loads(family_path.read_text(encoding="utf-8"))
              loaded.append((family_path, data))
              family = data.get("family", {})
              family_id = family.get("family_id")
              if family_id:
                  family_ids.add(family_id)
              for item in data.get("classes", []):
                  class_id = item.get("class_id") if isinstance(item, dict) else None
                  if class_id:
                      class_ids.add(class_id)

          print("Current canonical taxonomy content state:")
          print(f"  content_digest: {module.catalogue_content_digest(loaded)}")
          print(f"  family_ids: {sorted(family_ids)}")
          print(f"  class_count: {len(class_ids)}")
          PY
            exit "$status"
          fi

      - name: Rebuild Incident Case File projection
        run: python vigil/scripts/build-vigil-records.py --taxonomy-examples-only

      - name: Apply textbook case-study evidence exclusions
        run: |
          python vigil/taxonomy/filter_publication_case_examples.py
          python vigil/taxonomy/filter_publication_case_examples.py --check

      # Pull requests stop after validating the canonical taxonomy and publication inputs.
      # The durable publication is generated only after changes land on main.
      - name: Install PDF renderer on main publication build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m pip install --disable-pip-version-check weasyprint==69.0

      - name: Generate maintained PDF publication on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify maintained PDF publication on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          from pathlib import Path

          pdf = Path("vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf")
          if not pdf.exists() or pdf.stat().st_size < 5000:
              raise SystemExit("Full-reference PDF was not generated correctly")
          if pdf.read_bytes()[:5] != b"%PDF-":
              raise SystemExit("Full-reference PDF does not contain a valid PDF stream")
          print(f"PDF: {pdf.stat().st_size:,} bytes")
          PY

      - name: Commit published taxonomy release and generated outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            vigil/taxonomy/VIGIL.FailureTaxonomy.Index.json \
            vigil/taxonomy/families \
            vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json \
            vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf
          if git diff --cached --quiet; then
            echo "No taxonomy release or publication changes to commit."
          else
            git commit -m "Publish VIGIL Observatory taxonomy release"
            if ! git push; then
              echo "Branch advanced while taxonomy publication was building; a newer run owns release/publication refresh."
              exit 0
            fi
          fi
