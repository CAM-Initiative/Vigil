name: Fix OBS-0023 reciprocal failure link

on:
  push:
    branches:
      - governance/learn-record-exemplar
    paths:
      - "vigil/scripts/fix-obs0023-fm-link.py"
      - ".github/workflows/fix-obs0023-link.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: governance/learn-record-exemplar
          fetch-depth: 0
      - name: Correct reciprocal link
        run: python vigil/scripts/fix-obs0023-fm-link.py
      - name: Validate records
        run: |
          python -m json.tool vigil/records/observations/2026/VIGIL-2026-OBS-0023.json >/dev/null
          python -m json.tool vigil/records/failures/2026/VIGIL-2026-FM-0051.json >/dev/null
      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "No correction required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/records/observations/2026/VIGIL-2026-OBS-0023.json
          git commit -m "Correct OBS-0023 reciprocal failure link"
          git push origin HEAD:governance/learn-record-exemplar
