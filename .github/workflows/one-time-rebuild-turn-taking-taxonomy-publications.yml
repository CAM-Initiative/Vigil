name: One-time rebuild turn-taking taxonomy publications

on:
  push:
    branches:
      - agent/synthetic-turn-taking-classification
    paths:
      - ".github/workflows/one-time-rebuild-turn-taking-taxonomy-publications.yml"

permissions:
  contents: write

jobs:
  rebuild-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate taxonomy contract and release ledger
        run: python vigil/taxonomy/validate_taxonomy.py

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint==69.0

      - name: Rebuild Incident Case File projection
        run: python vigil/scripts/build-vigil-records.py --taxonomy-examples-only

      - name: Generate HTML and PDF publications
        run: |
          python vigil/taxonomy/render_taxonomy.py \
            --catalogue \
            --output-dir vigil/taxonomy/generated \
            --pdf

      - name: Verify publication artefacts
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("vigil/taxonomy/generated/VIGIL.FailureTaxonomy.FullReference.html")
          pdf = Path("vigil/taxonomy/generated/VIGIL.Observatory.FailureTaxonomy.FullReference.pdf")
          if not html.exists() or html.stat().st_size < 1000:
              raise SystemExit("Full-reference HTML was not generated correctly")
          if not pdf.exists() or pdf.stat().st_size < 5000 or not pdf.read_bytes().startswith(b"%PDF-"):
              raise SystemExit("Full-reference PDF was not generated correctly")
          print(f"HTML: {html.stat().st_size:,} bytes")
          print(f"PDF: {pdf.stat().st_size:,} bytes")
          PY

      - name: Commit generated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            vigil/taxonomy/generated/VIGIL.FailureTaxonomy.CaseFileExamples.json \
            vigil/taxonomy/generated/*.html \
            vigil/taxonomy/generated/*.pdf
          if git diff --cached --quiet; then
            echo "No taxonomy publication changes to commit."
          else
            git commit -m "Rebuild taxonomy publications for turn-state class"
            git push
          fi
