name: FM system-context reconciliation

on:
  push:
    branches:
      - agent/instrumental-coercive-influence-capability-revalidation
    paths:
      - "vigil/scripts/reconcile-fm-system-context.py"
      - "vigil/scripts/apply-fm-system-context-contract.py"
      - "vigil/tests/test_reconcile_fm_system_context.py"
      - ".github/workflows/fm-system-context-reconciliation.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Apply permanent FM system-context contract
        run: python vigil/scripts/apply-fm-system-context-contract.py

      - name: Tighten unresolved-system reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vigil/scripts/reconcile-fm-system-context.py")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              '        if legacy in CONCRETE_LEGACY_PROVIDERS:',
              '            context.setdefault("vendor_cluster", [legacy])',
              '            context.setdefault("primary_evidenced_vendors", [])',
          ])
          new = "\n".join([
              '        if legacy in CONCRETE_LEGACY_PROVIDERS:',
              '            context.setdefault("vendor_cluster", [legacy])',
              '            context.setdefault("primary_evidenced_vendors", [])',
              '        else:',
              '            if legacy == "Multi Vendor":',
              '                context["platform_or_vendor"] = "Unknown"',
              '            context["vendor_cluster"] = []',
              '            context["primary_evidenced_vendors"] = []',
          ])
          if old not in text:
              raise SystemExit("reconciler logic marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Reconcile all failure-mode system contexts
        run: python vigil/scripts/reconcile-fm-system-context.py --write-report

      - name: Test FM system-context reconciliation
        run: python vigil/tests/test_reconcile_fm_system_context.py

      - name: Verify reconciled failure-mode system contexts
        run: python vigil/scripts/reconcile-fm-system-context.py --check

      - name: Refresh deterministic triage inventory
        run: python vigil/scripts/audit-vigil-triage.py

      - name: Test VIGIL record validator
        run: python vigil/scripts/test_validate_vigil_records.py

      - name: Validate reconciled VIGIL records
        run: python vigil/scripts/validate-vigil-records.py

      - name: Verify triage inventory freshness
        run: python vigil/scripts/audit-vigil-triage.py --check

      - name: Commit system-context contract and generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            vigil/records/failures \
            vigil/docs/reviews/FM-SYSTEM-CONTEXT-01-evidence-rollup-reconciliation.md \
            vigil/VIGIL.Schema.json \
            vigil/templates/failure-mode-record-template.json \
            vigil/templates/failure-mode-record-template.md \
            vigil/scripts/reconcile-fm-system-context.py \
            vigil/scripts/validate-vigil-records.py \
            .github/workflows/vigil-records.yml \
            vigil/docs/2026-triage-model-inventory.json \
            vigil/docs/2026-triage-model-inventory.md
          if git diff --cached --quiet; then
            echo "FM system-context contract already current."
          else
            git commit -m "Enforce evidence-backed FM system context"
            git push
          fi
