name: EXTREQ-13 IEEE 7009 identity retirement

on:
  push:
    branches:
      - agent/extreq-05-ieee-7014-1-fidelity-review
    paths:
      - .github/workflows/extreq13-ieee-7009-retirement.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/extreq-05-ieee-7014-1-fidelity-review
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply IEEE 7009 approved identity retirement and graph cleanup
        run: python vigil/scripts/extreq13_ieee_7009_identity_retirement.py

      - name: Update regression contracts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path("vigil/tests/test_external_requirement_metadata.py");t=p.read_text()
          t,n=re.subn(r'assert len\(ids\) == \d+','assert len(ids) == 905',t,count=1);assert n==1;p.write_text(t)

          p=Path("vigil/tests/test_external_requirement_fidelity.py");t=p.read_text()
          t=t.replace('self.assertEqual(summary["fidelity_assured_effective_complete_sources"], 16)','self.assertEqual(summary["fidelity_assured_effective_complete_sources"], 17)')
          t=t.replace('self.assertGreaterEqual(summary["effective_partial_due_fidelity"], 1)','self.assertEqual(summary["effective_partial_due_fidelity"], 0)')
          t=t.replace('self.assertTrue(any("effective downgrade" in warning for warning in warnings))','self.assertEqual(warnings, [])')
          t=t.replace('self.assertEqual(status[("IEEE-7009", "2024")], "requires-reextraction")','self.assertEqual(status[("IEEE-7009", "2024")], "assured")')
          p.write_text(t)
          PY

      - name: Replace IEEE 7009 fidelity regression
        run: |
          cat > vigil/tests/test_ieee_7009_fidelity.py <<'PY'
          #!/usr/bin/env python3
          import json
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          REQ=ROOT/"external_governance"/"requirements"
          DIGEST="9fb640fd57202fcc1c90aec0b6b767bf5c4621bfdefa7911c5e102425a83b133"
          RETIRED={"EXTREQ-528978BC3EB32446","EXTREQ-BBE358DBC3A6FD24","EXTREQ-C2FC30A1E260F4C1","EXTREQ-4041B6E279EF30CC"}
          records=json.loads((REQ/"requirements"/"IEEE-7009"/"2024.json").read_text())
          ids={r["requirement_id"] for r in records}
          assert len(records)==63
          assert not (RETIRED & ids)
          assert all(r["source_review_date"]=="2026-09-03" for r in records)
          assert all(r["interpretation_provenance"]["reviewed_source_digest"]==DIGEST for r in records)
          retire=json.loads((REQ/"retirements"/"IEEE-7009-2024.json").read_text())
          assert {r["requirement_id"] for r in retire["retired_requirements"]}==RETIRED
          successors={sid for r in retire["retired_requirements"] for sid in r["successor_requirement_ids"]}
          assert successors <= ids
          ledger=json.loads((REQ/"metadata-review.json").read_text())
          review_ids={e["requirement_id"] for e in ledger["entries"]}
          assert not (RETIRED & review_ids)
          backlog=json.loads((REQ/"reextraction-backlog.json").read_text())
          assert not [e for e in backlog["entries"] if e.get("external_source_id")=="IEEE-7009" and e.get("source_version")=="2024"]
          fidelity=json.loads((REQ/"source-fidelity.json").read_text())
          f=next(e for e in fidelity["entries"] if e["external_source_id"]=="IEEE-7009" and e["source_version"]=="2024")
          assert f["fidelity_status"]=="assured"
          assert f["effective_extraction_status"]=="complete"
          assert not f["known_fidelity_gaps"]
          assert set(f["audited_requirement_ids"])==ids
          print("IEEE 7009 identity retirement regression valid")
          PY
          python vigil/tests/test_ieee_7009_fidelity.py

      - name: Write EXTREQ-13 audit note
        run: |
          cat > vigil/docs/audits/external-requirements/EXTREQ-13-IEEE-7009-IDENTITY-RETIREMENT.md <<'MD'
          # EXTREQ-13 — IEEE 7009-2024 identity retirement

          **Source:** IEEE Std 7009-2024
          **VIGIL source:** EXT-564A4CAA4F00
          **Decision date:** 2026-09-04
          **Decision basis:** explicit maintainer approval following licensed-primary semantic-fidelity review

          ## Decision

          Four legacy aggregate analytical identities were retired from the live IEEE 7009 corpus because each compressed multiple independently assessable source-native propositions already represented by linked atomic records.

          The retired immutable IDs are preserved in retirements/IEEE-7009-2024.json together with clause locators, reasons and successor IDs. Git history remains the authoritative record of their prior full canonical content.

          No atomic successor was created by this retirement pass: all successors were already canonical and source-reviewed.

          ## Result

          The live IEEE 7009 shard now contains 63 records. The four source-specific re-extraction backlog entries are resolved. IEEE 7009 is promoted from requires-reextraction / partial to assured / complete only because the aggregate identities are no longer live alongside their atomic successors.

          No IEEE source text is stored in VIGIL and no human verification of the standard text is claimed beyond the maintainer's explicit architectural approval of the retirement action.
          MD

      - name: Regenerate and validate
        run: |
          set -e
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-metadata.py --write-report
          PYTHONPATH=vigil/scripts python vigil/scripts/validate-external-requirement-fidelity.py
          python vigil/scripts/manage-external-requirements.py build
          python vigil/scripts/manage-external-requirements.py validate --check-generated
          python vigil/tests/test_ieee_7009_fidelity.py
          PYTHONPATH=vigil/scripts python vigil/tests/test_external_requirement_metadata.py
          python vigil/tests/test_external_requirement_fidelity.py
          python -m unittest vigil/tests/test_external_requirements.py vigil/tests/test_external_sources.py

      - name: Assert expected final state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("vigil/external_governance/requirements/metadata-review-report.json").read_text())
          s=d.get("summary",d)
          print(s)
          assert s["records"]==986
          assert s["canonical_records"]==884
          assert s["metadata_complete"]==905
          assert s["review_required_records"]==81
          assert s["review_required_fields"]==648
          assert s["reextraction_backlog_entries"]==0
          PY

      - name: Remove one-off EXTREQ-13 machinery
        run: |
          rm -f vigil/scripts/extreq13_ieee_7009_identity_retirement.py
          rm -f .github/workflows/extreq13-ieee-7009-retirement.yml

      - name: Commit validated IEEE 7009 retirement
        run: |
          set -e
          git config user.name "CAM-Initiative"
          git config user.email "aeon.tier@protonmail.com"
          git add -A
          git diff --cached --check
          git commit -m "EXTREQ-13: retire IEEE 7009 legacy aggregates"
          git push origin HEAD:agent/extreq-05-ieee-7014-1-fidelity-review
