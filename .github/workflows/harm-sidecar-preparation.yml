name: Prepare sparse HIM sidecar for feature branch

on:
  push:
    branches:
      - feat/sparse-harm-dimension-index-20261024
    paths:
      - "vigil/scripts/build-vigil-public-records.py"
      - ".github/workflows/harm-sidecar-preparation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Generate sidecar deterministically from canonical incidents
        run: |
          python vigil/scripts/build-vigil-public-records.py
          cp vigil/VIGIL.Harm.Dimensions.Index.json /tmp/harm-sidecar.json
          python vigil/scripts/build-vigil-public-records.py
          cmp /tmp/harm-sidecar.json vigil/VIGIL.Harm.Dimensions.Index.json
      - name: Commit the derived sidecar only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigil/VIGIL.Harm.Dimensions.Index.json
          if ! git diff --cached --quiet; then
            git commit -m "data: generate sparse HIM sidecar [skip ci]"
            git push
          fi
